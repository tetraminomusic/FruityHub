# Пушишь тег vX.Y.Z → GitHub собирает exe, mac-версии и сервер и выкладывает в Releases.
# Адрес сервера: Settings → Secrets and variables → Actions → Variables → UZBEK_SERVER, код — Secrets → UZBEK_SERVER_CODE.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - run: go test ./...
      - run: |
          curl -sSL https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F0.29.0/apple-codesign-0.29.0-x86_64-unknown-linux-musl.tar.gz | tar -xz
          sudo cp apple-codesign-*/rcodesign /usr/local/bin/
      - run: ./build.sh "${GITHUB_REF_NAME#v}"
        env: { SERVER: "${{ vars.UZBEK_SERVER }}", SERVER_CODE: "${{ secrets.UZBEK_SERVER_CODE }}" }
      - run: gh release create "$GITHUB_REF_NAME" dist/FruityHub-*.zip dist/uzbek-server.tar.gz --generate-notes
        env: { GH_TOKEN: "${{ github.token }}" }
