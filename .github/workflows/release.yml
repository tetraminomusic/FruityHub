# Пушишь тег vX.Y.Z → GitHub собирает exe и mac-версии и выкладывает в Releases.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - run: go test ./...
      - run: |
          curl -sSL https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F0.29.0/apple-codesign-0.29.0-x86_64-unknown-linux-musl.tar.gz | tar -xz
          sudo cp apple-codesign-*/rcodesign /usr/local/bin/
      - run: ./build.sh "${GITHUB_REF_NAME#v}"
        env: { REGISTRY: "${{ github.repository_owner }}" }
      - run: gh release create "$GITHUB_REF_NAME" dist/ProgrammaUzbeka-*.zip --generate-notes
        env: { GH_TOKEN: "${{ github.token }}" }
