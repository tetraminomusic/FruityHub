# Тесты на каждый пуш в ветку и на каждый pull request.
name: ci
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - run: node scripts/test-ui.js
      - run: node scripts/test-publish-updates.js
      - run: go vet ./...
      - run: go test ./...
      - name: FLP benchmark smoke check (generated fixtures)
        run: go test ./internal/flp -run '^$' -bench '^BenchmarkFLP$/^Small$/^(Parse|Info)$' -benchtime=1x
      - name: Cache and archive benchmark smoke check
        run: go test ./internal/app -run '^$' -bench '^(BenchmarkFLPCacheHit|BenchmarkArchive)$' -benchtime=1x
      - name: Project traversal benchmark smoke check
        run: go test ./internal/app -run '^$' -bench '^BenchmarkProject(FLPs|Analyze|MainFLP)$/^Files100$' -benchtime=1x
      - name: UI API latency smoke check
        run: go test ./internal/app -run '^$' -bench '^BenchmarkUILatency$/^(ListCold20|ProjectCold)$' -benchtime=1x
      - name: Git project opening smoke check
        run: go test ./internal/app -run '^$' -bench '^BenchmarkGitProjectOpening$/^Warm$' -benchtime=1x
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - run: go test ./internal/flp ./internal/ui
      - run: go test ./internal/app -run 'TestGit|TestQuickStateKeepsIdentityAndProjectList|TestRenderNotifications|TestPinsAndTrayPersist|TestProject|TestUIProjectMetadataAndAnalysis|TestFLPMetadata'
      - run: go build ./cmd/fruityhub
      - name: FLP benchmark smoke check (generated fixtures)
        run: go test ./internal/flp -run '^$' -bench '^BenchmarkFLP$/^Small$/^(Parse|Info)$' -benchtime=1x
      - name: Cache and archive benchmark smoke check
        run: go test ./internal/app -run '^$' -bench '^(BenchmarkFLPCacheHit|BenchmarkArchive)$' -benchtime=1x
      - name: Project traversal benchmark smoke check
        run: go test ./internal/app -run '^$' -bench '^BenchmarkProject(FLPs|Analyze|MainFLP)$/^Files100$' -benchtime=1x
      - name: UI API latency smoke check
        run: go test ./internal/app -run '^$' -bench '^BenchmarkUILatency$/^(ListCold20|ProjectCold)$' -benchtime=1x
      - name: Git project opening smoke check
        run: go test ./internal/app -run '^$' -bench '^BenchmarkGitProjectOpening$/^Warm$' -benchtime=1x
