# Тесты на каждый пуш в ветку и на каждый pull request.
name: ci
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - run: node scripts/test-ui.js
      - run: go vet ./...
      - run: go test ./...
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - run: go test ./internal/ui
      - run: go test ./internal/app -run 'TestGitCacheTracksExternalChanges|TestQuickStateKeepsIdentityAndProjectList|TestRenderNotifications|TestPinsAndTrayPersist'
      - run: go build ./cmd/fruityhub
