<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>прога узбека</title>
<style>
:root{
  --bg:#0d0e11; --panel:rgba(16,17,22,.74); --panel2:rgba(40,43,52,.72); --solid:#1a1c21; --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.16);
  --text:#f1f2f4; --muted:#a3a7b0; --accent:#f7a531; --accent2:#ffbe5c; --ok:#4cc38a; --warn:#f2c94c; --bad:#ef5d5d; --blue:#6cb2ff; --violet:#a78bfa;
  --r:12px; --blur:saturate(150%) blur(18px);
  font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; font-size:14px;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;color:var(--text);display:flex;flex-direction:column;user-select:none;-webkit-user-select:none;background:#0d0e11}
/* background picture: the whole meme stays visible (fit to height), a blurred copy fills the rest */
body::before{content:"";position:fixed;inset:-60px;z-index:-2;pointer-events:none;background:#0d0e11 url('/assets/bg') center/cover no-repeat;filter:blur(36px) brightness(.42) saturate(1.1)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:linear-gradient(90deg,rgba(10,11,14,.55) 0,rgba(10,11,14,.18) 38%,rgba(10,11,14,.30) 100%),linear-gradient(180deg,rgba(10,11,14,.10) 40%,rgba(10,11,14,.55) 100%),url('/assets/bg') right center/auto 100% no-repeat}
body.nobg::before,body.nobg::after{background:radial-gradient(90% 70% at 80% 0%,#3a2a12 0%,#141518 55%);filter:none}
main>h1,main>.muted,main>.row{text-shadow:0 1px 3px rgba(0,0,0,.85),0 0 14px rgba(0,0,0,.6)}
input,textarea,.selectable,.mono,td{user-select:text;-webkit-user-select:text}
.glass{background:var(--panel);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
button{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line2);border-radius:9px;padding:7px 12px;cursor:pointer;white-space:nowrap;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:background .15s,border-color .15s}
button:hover{border-color:rgba(255,255,255,.32);background:rgba(60,64,75,.7)}
button.primary{background:var(--accent);color:#1a1205;border-color:var(--accent);font-weight:650}
button.primary:hover{background:var(--accent2)}
button.danger{background:rgba(90,26,26,.7);border-color:#8a3434;color:#ffc0c0}
button.ghost{background:transparent;border-color:transparent;color:var(--muted);-webkit-backdrop-filter:none;backdrop-filter:none}
button.ghost:hover{color:var(--text);background:rgba(255,255,255,.07)}
button.sm{padding:4px 9px;font-size:12px}
button:disabled{opacity:.45;cursor:default}
/* icons are semi-transparent and light up on hover */
.ic{opacity:.62;transition:opacity .15s;display:inline-block}
button:hover .ic,.pitem:hover .ic,.ghead:hover .ic,.tab:hover .ic,.sel .ic{opacity:1}
input,textarea,select{font:inherit;color:var(--text);background:rgba(8,9,12,.62);border:1px solid var(--line2);border-radius:9px;padding:8px 10px;width:100%}
select option{background:#1a1c21}
textarea{resize:vertical;min-height:60px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
label{display:block;color:var(--muted);font-size:12px;margin:10px 0 4px}
a{color:var(--blue);cursor:pointer}
header{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line)}
.logo{font-weight:800;letter-spacing:.2px;display:flex;align-items:center;gap:9px;font-size:15px}
.logo img{width:26px;height:26px;border-radius:7px;object-fit:cover;box-shadow:0 2px 10px rgba(0,0,0,.4)}
.logo .mark{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#f7a531,#e0662c);display:grid;place-items:center;color:#1a1205;font-size:14px}
.spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);font-size:12px;color:var(--muted)}
.wrap{flex:1;display:flex;min-height:0}
aside{width:270px;border-right:1px solid var(--line);display:flex;flex-direction:column}
aside .list{flex:1;overflow:auto;padding:8px}
.pitem{padding:9px 10px;border-radius:9px;cursor:pointer;display:flex;align-items:center;gap:8px}
.pitem:hover{background:rgba(255,255,255,.07)}
.pitem.sel{background:rgba(247,165,49,.16);box-shadow:inset 0 0 0 1px rgba(247,165,49,.35)}
.pitem .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{font-size:11px;border-radius:99px;padding:1px 6px;background:rgba(247,165,49,.22);color:var(--accent2)}
.badge.v{background:rgba(167,139,250,.22);color:#d6c9ff}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:var(--ok)} .dot.me{background:var(--accent)} .dot.other{background:var(--bad)}
aside .bottom{padding:10px;display:grid;gap:6px;border-top:1px solid var(--line)}
main{flex:1;overflow:auto;padding:20px 26px}
h1{font-size:23px;margin:0;text-shadow:0 1px 12px rgba(0,0,0,.5)}
h3{margin:18px 0 8px;font-size:15px}
.muted{color:var(--muted)} .small{font-size:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.card{background:var(--panel);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin:12px 0}
.banner{display:flex;align-items:center;gap:12px;border-radius:var(--r);padding:12px 16px;border:1px solid var(--line);background:var(--panel);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.banner.me{border-color:rgba(247,165,49,.45);background:rgba(60,40,10,.62)}
.banner.other{border-color:rgba(239,93,93,.45);background:rgba(60,18,18,.62)}
.banner.free{border-color:rgba(76,195,138,.4);background:rgba(14,44,30,.6)}
.banner .big{font-size:16px;font-weight:600}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.actions button{padding:10px 16px}
.tabs{display:flex;gap:4px;border:1px solid var(--line);border-bottom-color:rgba(255,255,255,.06);margin-top:14px;overflow-x:auto;background:var(--panel);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-radius:var(--r) var(--r) 0 0;padding:0 6px}
.phead{margin:0;padding:12px 16px}
.phead h1{text-shadow:none}
.tab{padding:9px 14px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tab.sel{color:var(--text);border-color:var(--accent)}
.tab .cnt{font-size:11px;background:var(--panel2);border-radius:99px;padding:1px 7px;margin-left:5px}
.tab .cnt.bad{background:rgba(160,40,40,.6);color:#ffc4c4}
.tab .cnt.hot{background:rgba(247,165,49,.25);color:var(--accent2)}
#tabbody{background:var(--panel);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--line);border-top:0;border-radius:0 0 var(--r) var(--r);padding:4px 14px 14px}
#tabbody .card{background:rgba(255,255,255,.04);-webkit-backdrop-filter:none;backdrop-filter:none}
table{width:100%;border-collapse:collapse;margin-top:8px}
th{text-align:left;color:var(--muted);font-weight:500;font-size:12px;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:7px 8px;border-bottom:1px solid rgba(255,255,255,.06);vertical-align:top}
tr:hover td{background:rgba(255,255,255,.035)}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:5px;background:var(--panel2);color:var(--muted);white-space:nowrap}
.tag.ok{background:rgba(30,90,60,.6);color:#8ff0c0}.tag.bad{background:rgba(110,30,30,.6);color:#ffb0b0}.tag.warn{background:rgba(110,90,20,.55);color:#ffe28f}.tag.blue{background:rgba(30,70,120,.55);color:#b3d6ff}.tag.v{background:rgba(80,60,150,.5);color:#ddd0ff}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.ellip{max-width:520px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:10;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.modal{background:rgba(24,25,31,.86);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--line2);border-radius:16px;padding:20px 22px;width:min(660px,94vw);max-height:88vh;overflow:auto;box-shadow:0 24px 70px rgba(0,0,0,.6)}
.modal.wide{width:min(860px,96vw)}
.modal h2{margin:0 0 6px;font-size:18px}
.err{white-space:pre-wrap}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;color:var(--muted);gap:10px}
.empty .box{background:var(--panel);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--line);border-radius:16px;padding:26px 34px}
.warnbox{border-left:3px solid var(--warn);background:rgba(70,60,15,.62);padding:8px 12px;border-radius:7px;margin:6px 0;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.badbox{border-left:3px solid var(--bad);background:rgba(80,22,22,.66);padding:8px 12px;border-radius:7px;margin:6px 0;color:#ffd0d0}
.okbox{border-left:3px solid var(--ok);background:rgba(16,60,40,.6);padding:8px 12px;border-radius:7px;margin:6px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.switch{display:flex;align-items:center;gap:8px;margin:8px 0;cursor:pointer;color:var(--text);font-size:14px}
.switch input{width:auto}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:rgba(30,32,38,.9);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--line2);padding:10px 14px;border-radius:10px;z-index:30;max-width:420px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.top{display:grid;grid-template-columns:1fr 360px;gap:14px;margin-top:14px}
.preview{border:1px dashed rgba(255,255,255,.22);border-radius:var(--r);padding:12px 14px;background:var(--panel);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);transition:.15s}
.preview.drag{border-color:var(--accent);background:rgba(60,40,10,.6)}
.preview audio{width:100%;height:36px;margin:6px 0}
.stage{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;background:rgba(80,60,150,.55);color:#e0d6ff;font-size:12px;font-weight:600}
.cm{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.cm .av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;flex:none;color:#1a1205}
.cm .body{flex:1;min-width:0}
.cm .text{white-space:pre-wrap;word-wrap:break-word;margin-top:3px;user-select:text;-webkit-user-select:text}
.cm.done .text{text-decoration:line-through;color:var(--muted)}
.cm input[type=checkbox]{width:18px;height:18px;margin-top:6px;accent-color:var(--ok)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:9px;overflow:hidden}
.seg button{border:0;border-radius:0;background:transparent;color:var(--muted)}
.seg button.on{background:var(--panel2);color:var(--text)}
.tasks{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:25;width:360px;max-width:calc(100vw - 32px)}
.task{background:rgba(30,32,38,.86);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--line2);border-radius:12px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.task.ok{border-color:rgba(76,195,138,.5)}.task.err{border-color:#8a3434;background:rgba(55,20,20,.9)}
.task .t{display:flex;align-items:center;gap:8px;font-weight:600}
.task .s{color:var(--muted);font-size:12px;margin-top:4px;min-height:16px}
.task .bar{height:5px;border-radius:9px;background:rgba(255,255,255,.12);margin-top:8px;overflow:hidden}
.task .bar i{display:block;height:100%;background:var(--accent);border-radius:9px;transition:width .3s}
.task .bar.ind i{width:35%!important;animation:ind 1.2s ease-in-out infinite}
@keyframes ind{0%{margin-left:-35%}100%{margin-left:100%}}
.spin{width:14px;height:14px;border:2px solid #555;border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.details{white-space:pre-wrap;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:#c4c7ce;background:rgba(0,0,0,.4);border-radius:6px;padding:8px;margin-top:8px;max-height:180px;overflow:auto}
.ghead{display:flex;align-items:center;gap:6px;padding:7px 8px;border-radius:9px;cursor:pointer;color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.ghead:hover{background:rgba(255,255,255,.07);color:var(--text)}
.ghead .gn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ghead .more,.pitem .more{opacity:0;padding:0 4px;border-radius:5px}
.ghead:hover .more,.pitem:hover .more{opacity:.8}
.ghead .more:hover,.pitem .more:hover{background:rgba(255,255,255,.12);opacity:1}
.gbody{margin-left:10px;border-left:1px solid var(--line);padding-left:4px}
.drop{outline:2px dashed var(--accent);outline-offset:-2px;background:rgba(60,40,10,.6)!important}
.menu{position:fixed;z-index:40;background:rgba(30,32,38,.92);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--line2);border-radius:10px;padding:4px;min-width:200px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.menu div{padding:7px 10px;border-radius:6px;cursor:pointer}
.menu div:hover{background:rgba(255,255,255,.1)}
.menu .sep{height:1px;background:var(--line);margin:4px 0;padding:0}
.invite{margin:8px;border:1px solid rgba(247,165,49,.45);background:rgba(60,40,10,.66);border-radius:11px;padding:10px;font-size:13px}
.lookup{font-size:12px;margin-top:4px;min-height:16px}
.act{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.07);font-size:13px}
.act .tm{color:var(--muted);white-space:nowrap;font-size:12px;width:92px;flex:none}
.stabs{display:flex;gap:4px;padding:8px 8px 0}
.stab{flex:1;text-align:center;padding:7px 6px;border-radius:9px;cursor:pointer;color:var(--muted);font-size:13px}
.stab.sel{background:var(--panel2);color:var(--text)}
.stab .badge{margin-left:4px}
.avail{padding:10px;border-radius:11px;border:1px solid var(--line);margin:6px 0;background:rgba(255,255,255,.05)}
.avail .an{font-weight:600}
.flpchoice{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.person{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.ava{width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;color:#1a1205;font-weight:700;flex:none;position:relative}
.ava .on{position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;background:var(--ok);border:2px solid #1a1c21}
.radio{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:10px;margin:6px 0;cursor:pointer}
.radio:hover{background:rgba(255,255,255,.04)}
.radio input{width:auto;margin-top:3px}
.radio.on{border-color:rgba(247,165,49,.6);background:rgba(247,165,49,.08)}
@media (max-width:980px){.top{grid-template-columns:1fr}}
@media (max-width:760px){aside{width:210px}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="glass">
  <div class="logo"><img src="/assets/icon" alt="" onerror="this.outerHTML='<span class=mark>♪</span>'">прога узбека</div>
  <span class="chip" id="who" style="cursor:pointer">—</span>
  <span class="spacer"></span>
  <span class="chip" id="toolsChip" style="display:none"></span>
  <button class="ghost" onclick="openPeople()"><span class="ic">👥</span> Люди</button>
  <button class="ghost" onclick="openTransfers()"><span class="ic">🔌</span> Передачи</button>
  <button class="ghost" onclick="openJournal()"><span class="ic">📜</span> Журнал</button>
  <button class="ghost" onclick="openSettings()"><span class="ic">⚙</span> Настройки</button>
  <button class="ghost" id="quitBtn" title="Закрыть" onclick="quitApp()" style="display:none">⏻</button>
</header>
<div class="wrap">
  <aside class="glass">
    <div id="invites"></div>
    <div class="stabs"><div class="stab sel" id="st_my" onclick="sideTab('my')">Мои проекты</div><div class="stab" id="st_av" onclick="sideTab('av')">Доступные<span class="badge" id="avcnt" style="display:none"></span></div></div>
    <div class="list" id="plist"></div>
    <div class="list" id="alist" style="display:none"></div>
    <div class="bottom">
      <div class="row" style="flex-wrap:nowrap;gap:6px"><button style="flex:1" onclick="addProject()">＋ Добавить проект</button><button title="Новая папка в списке" onclick="newGroup()"><span class="ic">📁</span>＋</button></div>
    </div>
  </aside>
  <main id="main"></main>
</div>
<div id="modals"></div>
<div class="tasks" id="tasks"></div>

<script>
const TOKEN = "__FLSYNC_TOKEN__";
const STAGES = ["Идея","Набросок","Аранжировка","Запись","Сведение","Мастеринг","Готово"];
let S = {state:null, sel:null, proj:null, analysis:null, history:null, comments:null, preview:null, previewErr:null, previewProgress:null,
         tab:'changes', showService:false, notes:{}, invites:[], incoming:[], ready:[], busy:{}, followed:{}, shownReq:{}, trashSel:{}, ckind:'note', cfilter:'all'};
const BG=new Image(); BG.onerror=()=>document.body.classList.add('nobg'); BG.src='/assets/bg';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtSize = n => n==null?'':n<1024?n+' Б':n<1048576?(n/1024).toFixed(0)+' КБ':n<1073741824?(n/1048576).toFixed(1)+' МБ':(n/1073741824).toFixed(2)+' ГБ';
const fmtTime = t => new Date(t*1000).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
const enc = x => encodeURIComponent(x).replace(/'/g,'%27');
const color = name => { let h=0; for(const c of name||'') h=(h*31+c.charCodeAt(0))%360; return `hsl(${h} 70% 62%)` };

async function api(path, body){
  const opt = {method: body===undefined?'GET':'POST', headers:{'X-FLSync':TOKEN}};
  if (body!==undefined){opt.body=JSON.stringify(body);opt.headers['Content-Type']='application/json'}
  const r = await fetch(path,opt); const j = await r.json().catch(()=>({error:'bad response'}));
  if(!r.ok) throw new Error(j.error||r.statusText); return j;
}
function toast(msg, ms=3500){const d=document.createElement('div');d.className='toast';d.innerHTML=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),ms);return d}
setInterval(()=>api('/api/ping',{}).catch(()=>{}),20000); api('/api/ping',{}).catch(()=>{});

// External links open in the system browser (inside the app window they would go nowhere)
document.addEventListener('click', e=>{
  const a=e.target.closest('a[href]'); if(!a) return;
  const h=a.getAttribute('href'); if(/^https?:\/\//.test(h)){ e.preventDefault(); api('/api/openurl',{url:h}).catch(()=>{}) }
});

// ---------- dialogs (own ones: WKWebView ignores alert/confirm/prompt) ----------
function modal(html, onclose){
  const bg=document.createElement('div');bg.className='modal-bg';
  bg.innerHTML=`<div class="modal">${html}</div>`;
  bg.close=()=>{bg.remove(); onclose&&onclose()};
  bg.addEventListener('mousedown',e=>{if(e.target===bg && !bg.busy && !bg.sticky) bg.close()});
  $('#modals').appendChild(bg); return bg;
}
function uiAlert(msg, title='Ошибка'){ return new Promise(res=>{ const m=modal(`<h2>${esc(title)}</h2><div class="err">${esc(msg)}</div><div class="row" style="justify-content:flex-end;margin-top:14px"><button class="primary" id="ok">Понятно</button></div>`, res); m.querySelector('#ok').onclick=()=>m.close(); m.querySelector('#ok').focus() }) }
function uiConfirm(msg, {title='Точно?', ok='Да', danger=false}={}){ return new Promise(res=>{ let v=false; const m=modal(`<h2>${esc(title)}</h2><div>${msg}</div><div class="row" style="justify-content:flex-end;margin-top:14px"><button id="no">Отмена</button><button class="${danger?'danger':'primary'}" id="yes">${esc(ok)}</button></div>`, ()=>res(v)); m.querySelector('#no').onclick=()=>m.close(); m.querySelector('#yes').onclick=()=>{v=true;m.close()} }) }
function uiPrompt(title, {label='', value='', placeholder=''}={}){ return new Promise(res=>{ let v=null; const m=modal(`<h2>${esc(title)}</h2>${label?`<label>${esc(label)}</label>`:''}<input id="pv" value="${esc(value)}" placeholder="${esc(placeholder)}"><div class="row" style="justify-content:flex-end;margin-top:14px"><button id="no">Отмена</button><button class="primary" id="yes">OK</button></div>`, ()=>res(v)); const i=m.querySelector('#pv'); i.focus(); const go=()=>{v=i.value;m.close()}; m.querySelector('#yes').onclick=go; i.onkeydown=e=>{if(e.key==='Enter')go()}; m.querySelector('#no').onclick=()=>m.close() }) }
const fail = e => uiAlert(e.message||String(e));

// ---------- jobs ----------
// ---------- tasks: small cards with plain words and a progress bar ----------
function taskCard(title){
  const el=document.createElement('div'); el.className='task';
  el.innerHTML=`<div class="t"><span class="spin"></span><span class="tt">${esc(title)}</span></div><div class="s">Начинаю…</div><div class="bar ind"><i style="width:0"></i></div>`;
  $('#tasks').appendChild(el); return el;
}
function paintTask(el, j){
  const last=(j.steps||[])[(j.steps||[]).length-1]||'';
  const p=j.progress;
  el.querySelector('.s').textContent = p ? p.label + (p.pct>=0?` — ${p.pct}%`:'') : (last||'Работаю…');
  const bar=el.querySelector('.bar');
  if(p && p.pct>=0){ bar.classList.remove('ind'); bar.querySelector('i').style.width=p.pct+'%' } else bar.classList.add('ind');
}
function finishTask(el, j){
  const bar=el.querySelector('.bar'); bar.remove();
  const tt=el.querySelector('.t');
  if(j.error){
    el.classList.add('err');
    tt.innerHTML=`<span>⚠</span><span class="tt">${esc(j.title)} — не получилось</span><span class="spacer"></span><button class="ghost sm" onclick="this.closest('.task').remove()">✕</button>`;
    el.querySelector('.s').innerHTML=`<div style="color:#ffc4c4;font-size:13px;margin-top:2px">${esc(j.error)}</div>`+(j.details?`<a class="small muted" onclick="this.nextElementSibling.hidden=!this.nextElementSibling.hidden">Подробности для знающих</a><div class="details" hidden>${esc(j.details)}</div>`:'');
  } else {
    el.classList.add('ok');
    tt.innerHTML=`<span style="color:var(--ok)">✓</span><span class="tt">${esc(j.title)}</span>`;
    const st=(j.steps||[]).filter(x=>!/^✓/.test(x)).slice(-3);
    el.querySelector('.s').innerHTML = st.length? st.map(x=>`<div>${esc(x)}</div>`).join('') : 'Готово';
    setTimeout(()=>{ el.style.transition='opacity .4s'; el.style.opacity=0; setTimeout(()=>el.remove(),400) }, st.some(x=>x.startsWith('⚠'))?9000:3500);
  }
}
async function followJob(id, title, onDone){
  S.followed[id]=1;
  const el=taskCard(title);
  for(;;){
    let j; try{ j=await api('/api/job?id='+id) }catch(e){ await new Promise(r=>setTimeout(r,1000)); continue }
    if(title!==j.title) el.querySelector('.tt').textContent=j.title;
    if(!j.done){ paintTask(el,j); await new Promise(r=>setTimeout(r,400)); continue }
    finishTask(el,j);
    const r=j.result||{};
    if(!j.error && r.conflicts && r.conflicts.length) uiAlert(`Версия с сервера осталась под исходным именем, твоя сохранена рядом:\n\n${r.conflicts.map(c=>'• '+c).join('\n')}\n\nОткрой обе в FL Studio и перенеси нужное.`,'Вы оба поменяли один и тот же проект');
    onDone && onDone(j); refreshAll(); return j;
  }
}
async function runJob(path, body, {title, onDone}={}){
  let job; try{ job = await api(path, body) }catch(e){ fail(e); return null }
  return followJob(job.id, title||job.title, onDone);
}
// job without a modal (progress shown inline)
async function silentJob(path, body, onTick){
  const job = await api(path, body);
  for(;;){ const j = await api('/api/job?id='+job.id); onTick && onTick(j); if(j.done){ if(j.error) throw new Error(j.error); return j } await new Promise(r=>setTimeout(r,400)) }
}

// ---------- state ----------
async function refreshAll(){
  S.state = await api('/api/state');
  const st=S.state;
  renderWho();
  $('#quitBtn').style.display = st.windowed ? 'none' : '';
  const t=st.tools, tc=$('#toolsChip');
  if(!t.gitOk||!t.lfsOk){ tc.style.display=''; tc.innerHTML=`<span style="color:var(--warn)">⚠ ${!t.gitOk?'нет git':'нет git-lfs'}</span> <a onclick="installTools()">установить</a>` } else tc.style.display='none';
  renderList(); renderInvites();
  if(S.side==='av') loadAvailable(true); else if(st.registered && !S.avail) api('/api/available').then(a=>{ S.avail=a||[]; renderAvailable() }).catch(()=>{});
  if(S.sel) await loadProject(S.sel); else renderMain();
  if(!st.registered && !S.askedName){ S.askedName=true; openRegister(true) }
}
function projItem(p){
  let cls='', tip='';
  if(p.lock){ cls = p.lock.user===S.state.me?'me':'other'; tip = 'в работе у '+p.lock.user }
  else if(p.isRepo){ cls='ok'; tip='свободен' }
  const n=S.notes[p.path]||{};
  const badges=(n.unread?`<span class="badge" title="новые комментарии">💬 ${n.unread}</span>`:'')+
    (n.behind>0?`<span class="badge" title="на сервере новое">⤓</span>`:'');
  return `<div class="pitem ${S.sel===p.path?'sel':''}" draggable="true" data-path="${esc(p.path)}" title="${esc(p.path)}" onclick="selectProject('${enc(p.path)}')">
    <span class="dot ${cls}" title="${esc(tip)}"></span><span class="n">${esc(p.name)}</span>${badges}${p.exists?'':'<span class="tag bad">нет папки</span>'}
    <span class="more" onclick="event.stopPropagation();projMenu(event,'${enc(p.path)}')">⋯</span></div>`;
}
function renderList(){
  const ps=S.state?.projects||[], groups=S.state?.groups||[];
  const ids=new Set(groups.map(g=>g.id));
  let h=groups.map(g=>{
    const inG=ps.filter(p=>p.group===g.id);
    return `<div class="ghead" data-group="${g.id}" onclick="toggleGroup('${g.id}',${!g.collapsed})"><span>${g.collapsed?'▸':'▾'}</span><span>📁</span><span class="gn">${esc(g.name)}</span><span class="muted">${inG.length}</span><span class="more" onclick="event.stopPropagation();groupMenu(event,'${g.id}')">⋯</span></div>
      ${g.collapsed?'':`<div class="gbody" data-group="${g.id}">${inG.map(projItem).join('')||'<div class="muted small" style="padding:6px 10px">перетащи сюда проект</div>'}</div>`}`}).join('');
  const top=ps.filter(p=>!p.group||!ids.has(p.group));
  h+=`<div data-group="" class="topzone" style="min-height:${groups.length?24:0}px">${top.map(projItem).join('')}</div>`;
  if(!ps.length) h=`<div class="muted small" style="padding:10px">Проектов пока нет. Добавь папку с .flp или прими приглашение друга.</div>`+ (groups.length?h:'');
  $('#plist').innerHTML=h;
  // drag & drop projects between folders
  document.querySelectorAll('.pitem[draggable]').forEach(el=>el.ondragstart=e=>{ e.dataTransfer.setData('text/x-project', el.dataset.path); e.dataTransfer.effectAllowed='move' });
  document.querySelectorAll('[data-group]').forEach(z=>{
    z.ondragover=e=>{ if([...e.dataTransfer.types].includes('text/x-project')){ e.preventDefault(); z.classList.add('drop') } };
    z.ondragleave=()=>z.classList.remove('drop');
    z.ondrop=e=>{ e.preventDefault(); z.classList.remove('drop'); const p=e.dataTransfer.getData('text/x-project'); if(p) moveProject(p, z.dataset.group) };
  });
}
async function moveProject(path, group){ try{ await api('/api/projects/move',{path,group}); await refreshAll() }catch(e){ fail(e) } }
async function toggleGroup(id, collapsed){ await api('/api/groups/update',{id,collapsed}).catch(()=>{}); refreshAll() }
async function newGroup(){ const n=await uiPrompt('Новая папка в списке',{label:'Название',placeholder:'напр. «Альбом 2027» или «Биты на продажу»'}); if(!n||!n.trim()) return; try{ await api('/api/groups/create',{name:n}); refreshAll() }catch(e){ fail(e) } }
function popMenu(ev, items){
  document.querySelectorAll('.menu').forEach(m=>m.remove());
  const m=document.createElement('div'); m.className='menu';
  m.innerHTML=items.map((it,i)=>it==='-'?'<div class="sep"></div>':`<div data-i="${i}">${it[0]}</div>`).join('');
  document.body.appendChild(m);
  const r=m.getBoundingClientRect();
  m.style.left=Math.min(ev.clientX, innerWidth-r.width-8)+'px'; m.style.top=Math.min(ev.clientY, innerHeight-r.height-8)+'px';
  m.onclick=e=>{ const d=e.target.closest('[data-i]'); if(!d) return; m.remove(); items[+d.dataset.i][1]() };
  setTimeout(()=>document.addEventListener('mousedown', function h(e){ if(!m.contains(e.target)){ m.remove(); document.removeEventListener('mousedown',h) } }),0);
}
function groupMenu(ev,id){
  const g=(S.state.groups||[]).find(x=>x.id===id);
  popMenu(ev,[['✎ Переименовать', async()=>{ const n=await uiPrompt('Переименовать папку',{value:g.name}); if(n&&n.trim()){ await api('/api/groups/update',{id,name:n}); refreshAll() } }],
    ['🗑 Удалить папку (проекты останутся)', async()=>{ if(await uiConfirm(`Удалить папку «${esc(g.name)}» из списка? Проекты из неё переместятся наверх, файлы не трогаются.`,{ok:'Удалить'})){ await api('/api/groups/delete',{id}); refreshAll() } }]]);
}
function projMenu(ev,encPath){
  const path=decodeURIComponent(encPath);
  const groups=S.state.groups||[], cur=(S.state.projects||[]).find(p=>p.path===path)?.group||'';
  const items=groups.filter(g=>g.id!==cur).map(g=>[`📁 Переместить в «${esc(g.name)}»`, ()=>moveProject(path,g.id)]);
  if(cur) items.push(['⤴ Убрать из папки', ()=>moveProject(path,'')]);
  items.push(['📁＋ В новую папку…', async()=>{ const n=await uiPrompt('Новая папка в списке',{label:'Название'}); if(n&&n.trim()){ const g=await api('/api/groups/create',{name:n}); moveProject(path,g.id) } }]);
  items.push('-', ['📂 Открыть в Finder/Проводнике', ()=>api('/api/project/open',{path})], ['✕ Убрать из списка', async()=>{ if(await uiConfirm('Убрать проект из списка? Файлы не удаляются.',{ok:'Убрать'})){ await api('/api/projects/remove',{path}); if(S.sel===path) S.sel=null; refreshAll() } }]);
  popMenu(ev, items);
}
async function selectProject(e){ PLAYER.pause(); PLAYER.removeAttribute('src'); PLAYER.dataset.src=''; S.sel=decodeURIComponent(e); S.analysis=null; S.history=null; S.comments=null; S.preview=null; S.previewErr=null; renderList(); await loadProject(S.sel); loadPreview(); if(S.tab==='talk') loadComments(true) }
async function loadProject(path){
  try{ S.proj = await api('/api/project?path='+enc(path)) }catch(e){ S.proj=null }
  renderMain();
  if(S.preview===null && !S.previewLoading && S.proj?.isRepo && S.proj?.remote) loadPreview();
  api('/api/project/analysis?path='+enc(path)).then(a=>{ if(S.sel===path){ S.analysis=a; renderMain() } }).catch(()=>{});
  if(S.tab==='history') loadHistory();
  if(S.comments===null) loadComments(false);
}
async function loadHistory(){ S.history = await api('/api/project/history?path='+enc(S.sel)).catch(()=>[]); renderMain() }
async function loadComments(fetch){
  const path=S.sel; if(!path) return;
  try{ const c = await api('/api/project/comments?path='+enc(path)+(fetch?'&fetch=1':'')); if(S.sel===path){ S.comments=c; renderMain() } }catch(e){}
  if(S.tab==='talk') api('/api/project/seen',{path}).then(pollNotes).catch(()=>{});
}
async function loadPreview(){
  const path=S.sel; if(!path||!S.proj?.isRepo||!S.proj?.remote||S.previewLoading) return;
  S.previewLoading=true; setTimeout(()=>S.previewLoading=false,1500);
  try{
    const p = await api('/api/project/preview?path='+enc(path)); if(S.sel!==path) return;
    S.preview=p; S.previewErr=null; renderPreview();
    if(p.asset && !p.cached){
      S.previewProgress='скачиваю…'; renderPreview();
      await silentJob('/api/project/preview/fetch',{path}, j=>{ S.previewProgress=j.progress?(j.progress.label+(j.progress.pct>=0?' — '+j.progress.pct+'%':'')):'скачиваю…'; renderPreview() });
      S.previewProgress=null; S.preview.cached=true; renderPreview();
    }
  }catch(e){ S.previewErr=e.message; S.previewProgress=null; renderPreview() }
}

// ---------- notifications (from our server) ----------
async function pollNotes(){
  let r; try{ r = await api('/api/notifications') }catch(e){ return }
  S.notes=r.projects||{}; S.invites=r.invites||[]; S.incoming=r.incoming||[]; S.ready=r.ready||[]; S.busy=r.busy||{}; S.serverError=r.serverError||'';
  renderList(); renderInvites(); renderWho();
  for(const q of S.incoming) if(!S.shownReq[q.id] && S.busy[q.id]!=='sending'){ S.shownReq[q.id]=1; askPermission(q) }
  for(const q of S.ready){
    if(q.kind==='installer'){ if(!S.shownReq['ready'+q.id]){ S.shownReq['ready'+q.id]=1; offerInstall(q) } }
    else if(S.busy[q.id]==='human' && !S.shownReq['ready'+q.id]){ S.shownReq['ready'+q.id]=1; offerInstall(q) }
  }
  for(const inv of S.invites) if(!S.shownReq['inv'+inv.id]){ S.shownReq['inv'+inv.id]=1; acceptInvite(inv.id) }
  // background jobs (plugins sent/installed automatically) get their own cards
  api('/api/jobs').then(js=>{ for(const j of js) if(!j.done && !S.followed[j.id]) followJob(j.id, j.title, ()=>{ if(S.tab==='plugins') loadReqs() }) }).catch(()=>{});
  const n=S.notes[S.sel];
  if(n && S.proj && n.behind!==S.proj.behind && !document.querySelector('.modal-bg')) loadProject(S.sel);
  if(n && S.tab==='talk' && n.unread) loadComments(false);
}
function renderWho(){
  const st=S.state; if(!st) return;
  const c=st.config, w=$('#who');
  if(!st.registered){ w.innerHTML='<span class="ic">👤</span> не зарегистрирован'; w.onclick=()=>openRegister(true); return }
  const ok=!S.serverError;
  w.innerHTML=`<span class="dot ${ok?'ok':'other'}" title="${ok?'сервер на связи':esc(S.serverError)}"></span> ${esc(c.userName)}`;
  w.title=ok?'Сервер: '+st.server:S.serverError; w.onclick=()=>openSettings();
}
function renderInvites(){
  const el=$('#invites'); if(!el) return;
  el.innerHTML=(S.invites||[]).map(i=>`<div class="invite"><span class="ic">📨</span> <b>${esc(i.from.nick)}</b> приглашает в проект «${esc(i.name)}»<div class="row" style="margin-top:6px;gap:6px"><button class="sm primary" onclick="acceptInvite('${i.id}')">Принять и скачать</button><button class="sm ghost" onclick="declineInvite('${i.id}')">Отказаться</button></div></div>`).join('')
    + (S.serverError && S.state?.registered ? `<div class="badbox small" style="margin:8px">⚠ ${esc(S.serverError)}</div>`:'');
}
async function declineInvite(id){ const inv=(S.invites||[]).find(x=>x.id===id); if(!inv) return;
  if(!await uiConfirm(`Отказаться от приглашения в «${esc(inv.name)}» от ${esc(inv.from.nick)}?`,{ok:'Отказаться'})) return;
  try{ await api('/api/invitations/decline',{id}); pollNotes() }catch(e){ fail(e) } }
// ---------- "Доступные": server projects you are in, not on this computer yet ----------
function sideTab(t){
  S.side=t; $('#st_my').classList.toggle('sel',t==='my'); $('#st_av').classList.toggle('sel',t==='av');
  $('#plist').style.display=t==='my'?'':'none'; $('#alist').style.display=t==='av'?'':'none';
  if(t==='av') loadAvailable();
}
async function loadAvailable(silent){
  const el=$('#alist');
  if(!S.state?.registered){ el.innerHTML='<div class="muted small" style="padding:10px">Зарегистрируйся, и здесь появятся проекты, в которых ты участвуешь.</div>'; return }
  if(!silent) el.innerHTML='<div class="muted small" style="padding:10px">Смотрю, что есть на сервере…</div>';
  try{ S.avail=(await api('/api/available'))||[] }catch(e){ el.innerHTML=`<div class="badbox small" style="margin:8px">${esc(e.message)}</div>`; return }
  renderAvailable();
}
function renderAvailable(){
  const el=$('#alist'), list=S.avail||[];
  const badge=$('#avcnt'); badge.textContent=list.length; badge.style.display=list.length?'':'none';
  el.innerHTML=`<div class="muted small" style="padding:4px 4px 6px">Проекты на сервере, где ты участник, которых ещё нет на этом компьютере.</div>`+
    (list.length?list.map(a=>`<div class="avail"><div class="an">${esc(a.name)}</div>
      <div class="muted small">${a.isOwner?'твой проект':'от '+esc(a.owner.nick)} · участники: ${(a.members||[]).map(m=>esc(m.nick)).join(', ')}</div>
      <div style="margin-top:6px"><button class="sm primary" onclick="downloadAvailable('${a.id}')"><span class="ic">⤓</span> Скачать</button></div></div>`).join('')
    :`<div class="muted small" style="padding:10px">Здесь пусто: всё уже скачано или тебя ещё никуда не позвали.</div>`)+
    `<div style="padding:4px"><a class="small" onclick="loadAvailable()">↻ обновить</a></div>`;
}
function pickParentDialog(title, text, onGo, okText='Скачать'){
  const def=S.state?.config?.lastParent||'';
  const m=modal(`<h2>${title}</h2><div>${text}</div>
    <label>Куда скачать (папка, в которой появится папка проекта)</label><div class="row" style="flex-wrap:nowrap"><input id="cp" value="${esc(def)}" placeholder="напр. Музыка/Проекты"><button id="pick">Выбрать…</button></div>
    <div class="row" style="justify-content:flex-end;margin-top:14px"><button id="later" class="ghost">Позже</button><button class="primary" id="go">${okText}</button></div>`);
  m.querySelector('#later').onclick=()=>m.close();
  m.querySelector('#pick').onclick=async()=>{const r=await api('/api/pickfolder',{}).catch(()=>({}));if(r.path)m.querySelector('#cp').value=r.path};
  m.querySelector('#go').onclick=()=>{ const parent=m.querySelector('#cp').value.trim(); if(!parent) return uiAlert('Выбери папку, куда скачать проект'); m.close(); onGo(parent) };
}
async function openDownloaded(j){ if(j&&!j.error&&j.result&&j.result.path){ S.sel=j.result.path; S.comments=null; S.preview=null; sideTab('my'); await refreshAll(); loadPreview() } }
function downloadAvailable(id){
  const a=(S.avail||[]).find(x=>x.id===id); if(!a) return;
  pickParentDialog(`⤓ Скачать «${esc(a.name)}»`, `<div class="muted small">${a.isOwner?'Твой проект':'Проект '+esc(a.owner.nick)}. Аудио докачается автоматически.</div>`, async parent=>{
    const j=await runJob('/api/available/clone',{id,parent},{title:'Скачиваю «'+a.name+'»'}); await openDownloaded(j); loadAvailable(true) });
}
function acceptInvite(id){
  const inv=(S.invites||[]).find(x=>x.id===id); if(!inv) return;
  pickParentDialog('📨 Приглашение в проект', `<b>${esc(inv.from.nick)}</b> приглашает тебя в проект <b>«${esc(inv.name)}»</b>.`, async parent=>{
    const j=await runJob('/api/invitations/accept',{id,parent},{title:'Скачиваю «'+inv.name+'»'}); await openDownloaded(j); pollNotes() }, 'Принять и скачать');
}
// ---------- participants of a project ----------
async function participantsDialog(){
  const path=S.sel;
  const m=modal(`<div class="row" style="justify-content:space-between"><h2><span class="ic">👥</span> Участники проекта</h2><button class="ghost sm" id="x">✕</button></div>
    <div id="plistp" class="muted small">Загружаю…</div>
    <label>Позвать в проект — ник в проге</label>
    <div class="row" style="flex-wrap:nowrap"><input id="pn" placeholder="ник друга" list="nicks"><button class="primary" id="pinv">Пригласить</button></div><div class="lookup" id="plk"></div>
    <datalist id="nicks"></datalist>
    <div class="muted small" style="margin-top:8px">Приглашение придёт прямо в прогу. Убирать участников может владелец проекта.</div>`);
  m.querySelector('#x').onclick=()=>m.close();
  bindLookup(m.querySelector('#pn'), m.querySelector('#plk'), m.querySelector('#nicks'));
  const load=async()=>{
    let r; try{ r=await api('/api/project/participants?path='+enc(path)) }catch(e){ m.querySelector('#plistp').innerHTML=`<div class="badbox">${esc(e.message)}</div>`; return }
    const p=r.project, me=r.me;
    const rows=[...(p.members||[]).map(u=>({u,pending:false})),...(p.invited||[]).map(i=>({u:i.to,pending:true}))];
    m.querySelector('#plistp').innerHTML=rows.map(({u,pending})=>`<div class="person" style="color:var(--text)">${avatar(u)}
      <div style="flex:1"><b>${esc(u.nick)}</b>${u.id===me?' <span class="muted small">(ты)</span>':''} <span class="muted small">${esc(u.os||'')}</span><div>${u.id===p.owner.id?'<span class="tag">владелец</span> ':''}${pending?'<span class="tag warn">приглашён, ещё не принял</span>':''}</div></div>
      ${p.isOwner&&u.id!==me?`<button class="sm ghost" data-u="${u.id}" data-n="${esc(u.nick)}" data-p="${pending?1:0}">${pending?'отменить приглашение':'убрать'}</button>`:''}

function avatar(u, size=30){ const n=u.nick||'?'; return `<span class="ava" style="width:${size}px;height:${size}px;background:${color(n)}">${esc(n[0].toUpperCase())}${u.online?'<i class="on" title="в сети"></i>':''}</span>` }
async function getUsers(force){ if(!S.users||force||Date.now()-S.usersAt>30000){ const r=await api('/api/users'); S.users=r.users||[]; S.usersAt=Date.now() } return S.users }
function bindLookup(input, out, datalist){
  getUsers().then(us=>{ if(datalist) datalist.innerHTML=us.filter(u=>u.id!==S.state.userId).map(u=>`<option value="${esc(u.nick)}">`).join('') }).catch(()=>{});
  let t; input.addEventListener('input',()=>{ clearTimeout(t); const v=input.value.split(/[,;]/).map(x=>x.trim()).filter(Boolean);
    if(!v.length){ out.innerHTML=''; return }
    t=setTimeout(async()=>{ let us=[]; try{ us=await getUsers() }catch(e){}
      out.innerHTML=v.map(n=>{ const u=us.find(x=>x.nick.toLowerCase()===n.toLowerCase());
        return u?`<span style="color:var(--ok)">✓ ${esc(u.nick)} <span class="muted">(${esc(u.os||'?')})</span></span>`:`<span style="color:var(--bad)">✗ «${esc(n)}» не зарегистрирован в проге</span>` }).join('<br>') },300) });
}

async function askPermission(r){

    <div class="card" style="margin:8px 0"><b style="font-size:16px">${esc(r.plugin)}</b> <span class="tag">${esc(r.format)}</span>${r.vendor?` <span class="muted">${esc(r.vendor)}</span>`:''}<div class="muted small">у ${esc(r.fromNick)} ${esc(r.fromOs)}</div></div>

    <div class="warnbox small" style="margin-top:10px">⚖ Передавай только бесплатные плагины или те, на которые у ${esc(r.fromNick)} есть своя лицензия. Библиотеки сэмплов и активация не копируются.</div>

  m.sticky=true;
  m.querySelector('#later').onclick=()=>m.close();
  m.querySelector('#no').onclick=async()=>{ try{ await api('/api/plugin/decline',{id:r.id,reason:m.querySelector('#why').value}); m.close(); toast('Запрос отклонён'); pollNotes() }catch(e){ fail(e) } };
  let insp; try{ insp=await api('/api/plugin/inspect?id='+enc(r.id)) }catch(e){ m.querySelector('#insp').innerHTML=`<div class="badbox">${esc(e.message)}</div>`; return }
  const opts=[];
  if(insp.compatible) opts.push({v:'', t:`Сам плагин${insp.version?' (версия '+esc(insp.version)+')':''} — ${fmtSize(insp.size)}`, d:esc(insp.reason)});
  for(const c of insp.installers||[]) opts.push({v:c.path, t:`Установщик ${esc(c.name)} — ${fmtSize(c.size)}`, d:'нашёл в «Загрузках»/на рабочем столе'});
  opts.push({v:'__pick__', t:'Выбрать файл установщика…', d:`например, скачанный с сайта производителя для ${esc(r.fromOs)}`});
  m.querySelector('#insp').innerHTML=`${insp.compatible?'':`<div class="warnbox small" style="color:var(--text)">${esc(insp.reason)}</div>`}
    <div style="margin-top:6px;color:var(--text)"><b>Что отправить:</b>${opts.map((o,i)=>`<label class="switch" style="align-items:flex-start"><input type="radio" name="what" value="${esc(o.v)}" ${i===0?'checked':''} style="margin-top:3px"><span>${o.t}<div class="muted small">${o.d}</div></span></label>`).join('')}</div>`;
  const yes=m.querySelector('#yes'); yes.disabled=false;
  yes.onclick=async()=>{
    let file=m.querySelector('input[name=what]:checked').value;
    if(file==='__pick__'){ const p=await api('/api/pickanyfile',{}).catch(()=>({})); if(!p.path) return; file=p.path }
    m.close(); await runJob('/api/plugin/approve',{id:r.id,file},{title:'Отправляю '+r.plugin+' для '+r.fromNick}); pollNotes();
  };
}

  if((p.extraFlps||[]).length) h+=`<div class="warnbox">📂 В папке проекта лежит несколько проектов FL: ${p.extraFlps.map(x=>'<b>'+esc(x)+'</b>').join(', ')}. Так их легко перепутать, а у друга всё смешается. <button class="sm" style="margin-left:6px" onclick="splitDialog()">Разобрать по папкам…</button></div>`;

// ---------- preview player ----------
// one persistent <audio>: it is moved between re-renders so playback never stops
const PLAYER=document.createElement('audio'); PLAYER.controls=true; PLAYER.preload='metadata';
function renderPreview(){
  const el=$('#preview'); if(!el) return;
  const p=S.preview;
  let h=`<div class="row" style="justify-content:space-between"><b>🎧 Превью трека</b><span class="row" style="gap:6px">
    <button class="sm" onclick="pickPreview()">${p?.asset?'Заменить':'Загрузить'}</button>${p?.asset?`<button class="sm ghost" title="Удалить превью" onclick="deletePreview()">🗑</button>`:''}</span></div>`;
  let showPlayer=false;
  if(S.previewErr) h+=`<div class="muted small" style="margin-top:6px">${esc(S.previewErr)}</div>`;
  else if(!p) h+=`<div class="muted small" style="margin-top:6px">Загружаю…</div>`;
  else if(!p.asset) h+=`<div class="muted small" style="margin-top:6px">Пока пусто. Перетащи сюда mp3, flac или wav — у проекта всегда один трек, новый заменяет старый.</div>`;
  else {
    const a=p.asset;
    if(p.cached && !S.previewProgress){ h+=`<div id="playerSlot"></div>`; showPlayer=true;
      const src=`/media/preview?path=${enc(S.sel)}&k=${TOKEN}&v=${a.id}`;
      if(PLAYER.dataset.src!==src){ PLAYER.dataset.src=src; PLAYER.src=src } }
    else h+=`<div class="muted small" style="margin:12px 0">⏳ ${esc(S.previewProgress||'скачиваю…')}</div>`;
    h+=`<div class="muted small ellip" title="${esc(p.fileName)}">${esc(p.fileName)} · ${esc(p.by)} · ${fmtSize(a.size)} · ${a.updated_at?new Date(a.updated_at).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):''}</div>`;
  }
  el.innerHTML=h;
  if(showPlayer) el.querySelector('#playerSlot').appendChild(PLAYER);
  else if(!PLAYER.paused) PLAYER.pause();
}
function bindPreviewDrop(){
  const el=$('#preview'); if(!el) return;
  el.ondragover=e=>{e.preventDefault(); el.classList.add('drag')};
  el.ondragleave=()=>el.classList.remove('drag');
  el.ondrop=async e=>{
    e.preventDefault(); el.classList.remove('drag');
    const f=e.dataTransfer.files[0]; if(!f) return;
    if(!/\.(mp3|flac|wav)$/i.test(f.name)) return uiAlert('Можно только mp3, flac или wav');
    if(!await uiConfirm(`Заменить превью на «${esc(f.name)}» (${fmtSize(f.size)})? Старое удалится.`,{ok:'Заменить'})) return;
    try{
      const r=await fetch('/api/project/preview/upload-raw?path='+enc(S.sel)+'&name='+enc(f.name),{method:'POST',headers:{'X-FLSync':TOKEN},body:f});
      const job=await r.json(); if(!r.ok) throw new Error(job.error);
      await watchExisting(job.id,'Загрузка превью');
    }catch(e){ fail(e) }
  };
}
async function watchExisting(id, title){ const j=await followJob(id,title); if(j&&!j.error){ S.preview=null; loadPreview() } }
async function pickPreview(){
  const r=await api('/api/pickfile',{}).catch(()=>({path:''})); if(!r.path) return;
  await runJob('/api/project/preview/upload',{path:S.sel,file:r.path},{title:'Загрузка превью'}); S.preview=null; loadPreview();
}
async function deletePreview(){ if(!await uiConfirm('Удалить превью трека у обоих?',{ok:'Удалить',danger:true})) return; try{ await api('/api/project/preview/delete',{path:S.sel}); S.preview=null; loadPreview() }catch(e){ fail(e) } }

async function loadReqs(){ try{ const r=await api('/api/plugin/requests'); S.reqs=r.requests||[]; S.busy=r.busy||S.busy; if(S.tab==='plugins'&&S.sel) renderMain() }catch(e){ S.reqs=S.reqs||[] } }
const RS={pending:['ждёт ответа','warn'],approved:['отправлен','blue'],declined:['отказ','bad'],installed:['установлен','ok'],failed:['ошибка','bad'],cancelled:['отменён','']};
function renderPlugins(){
  if(!S.analysis) return `<p class="muted">Сканирую плагины… (первый раз может занять до минуты)</p>`;
  if(!S.reqs){ loadReqs() }
  const rows=S.analysis.plugins, me=S.state.me, myId=S.state.userId;
  const reqs=S.reqs||[];
  const machines=S.proj.machines||[];
  const osOf=u=>(machines.find(m=>m.user===u)||{}).os || (u===me?S.state.os:'?');
  const stTag={ok:'ok',missing:'bad','other-format':'warn',unknown:''};
  const stName={ok:'есть',missing:'нет','other-format':'другой формат',unknown:'?'};
  const users=[...new Set(rows.flatMap(r=>r.machines.map(m=>m.user)))];
  const myReq=name=>reqs.find(r=>r.from===myId&&r.plugin.toLowerCase()===name.toLowerCase()&&['pending','approved'].includes(r.status));
  const needs=r=>{ const m=r.machines.find(x=>x.user===me); return r.format!=='FL' && (!m||m.state!=='ok') && !myReq(r.name) };
  // per friend: everything this project needs that I don't have and he does
  const bulk={};
  for(const r of rows) if(needs(r)) for(const o of r.machines) if(o.user!==me&&o.state==='ok') (bulk[o.user]=bulk[o.user]||[]).push(r);
  const cell=(r,u)=>{
    const m=r.machines.find(x=>x.user===u)||{state:'unknown'};
    let h=`<span class="tag ${stTag[m.state]}">${stName[m.state]}${m.version?' '+esc(m.version):''}</span>${m.note&&m.state!=='unknown'?`<div class="muted small">${esc(m.note)}</div>`:''}`;
    if(u===me && m.state!=='ok' && r.format!=='FL'){
      const q=myReq(r.name);
      if(q) h+=`<div style="margin-top:4px">${q.status==='approved'?(q.kind==='installer'?`<button class="sm primary" onclick="installReq('${q.id}')">⬇ Скачать установщик</button>`:`<span class="tag blue">устанавливается…</span>`):`<span class="tag v">запрошен у ${esc(q.toNick)}</span> <a class="small muted" onclick="cancelReq('${q.id}')">отменить</a>`}</div>`;
      else for(const o of (r.machines||[]).filter(x=>x.user!==me&&x.state==='ok')){
        const same=osOf(o.user)===S.state.os;
        h+=`<div style="margin-top:4px"><button class="sm" onclick="requestPlugins('${enc(o.user)}',[['${enc(r.name)}','${r.format}','${enc(r.vendor||'')}']])"><span class="ic">🔌</span> Скачать у ${esc(o.user)}</button>${same?'':`<div class="muted small" title="Файлы плагинов Mac и Windows разные">у него ${esc(osOf(o.user))} — пришлёт версию для твоей системы или установщик</div>`}</div>`;
      }
    }
    return h;
  };
  S.bulk=bulk;
  const projReqs=reqs.filter(q=>rows.some(r=>r.name.toLowerCase()===q.plugin.toLowerCase()));
  return `<div class="muted small" style="margin:10px 0">Список собирается из .flp и записывается в <b>PLUGINS.txt</b> в корне проекта. Каждый участник при отправке публикует, какие плагины (и каких версий) стоят у него.
      ${S.analysis.machines<2?'<br><span style="color:var(--warn)">Пока известен только твой компьютер — данные друга появятся после его первой отправки.</span>':''}</div>
    <div class="row"><button onclick="rescan()"><span class="ic">↻</span> Пересканировать мои плагины</button>
      ${Object.entries(bulk).map(([u,list])=>`<button class="primary" onclick="requestBulk('${enc(u)}')">⬇ Скачать у ${esc(u)} всё недостающее (${list.length})</button>`).join('')}
      <a class="small" onclick="openSettings()">где я ищу плагины →</a></div>
    ${rows.length?`<table><tr><th>Плагин</th><th>Формат</th>${users.map(u=>`<th>${esc(u)}${u===me?' (ты)':''}</th>`).join('')}<th>Где взять</th></tr>
    ${rows.map(r=>`<tr><td><b>${esc(r.name)}</b>${r.vendor?`<div class="muted small">${esc(r.vendor)}</div>`:''}${r.problem?`<div class="small" style="color:var(--warn)">⚠ ${esc(r.problem)}</div>`:''}</td>
      <td><span class="tag">${esc(r.format)}</span></td>${users.map(u=>`<td>${cell(r,u)}</td>`).join('')}
      <td>${r.link?`<a href="${esc(r.link)}">ссылка</a>`:''} <a class="small muted" onclick="editLink('${enc(r.name)}','${enc(r.link||'')}','${enc(r.linkNote||'')}')">${r.link?'✎':'+ ссылка'}</a>${r.linkNote?`<div class="muted small">${esc(r.linkNote)}</div>`:''}</td></tr>`).join('')}</table>`:'<p class="muted">Плагинов не найдено.</p>'}
    ${projReqs.length?`<h3>Передачи плагинов этого проекта</h3>${reqTable(projReqs.slice(0,30))}`:''}

async function requestPlugins(encTo, items){

  const list=items.map(([n,f,v])=>({plugin:decodeURIComponent(n),format:f,vendor:decodeURIComponent(v)}));
  const what=list.length===1?`плагин <b>${esc(list[0].plugin)}</b>`:`плагины (${list.length}): ${list.slice(0,8).map(x=>'<b>'+esc(x.plugin)+'</b>').join(', ')}${list.length>8?'…':''}`;
  if(!await uiConfirm(`Скачать ${what} с компьютера <b>${esc(to)}</b>? Если ${esc(to)} разрешил это в настройках — всё придёт и установится само, иначе у него всплывёт запрос.`,{ok:'Отправить запрос',title:'Плагины от друга'})) return;
  try{ const r=await api('/api/plugin/request',{to,items:list}); toast(r.length?`Запрошено у ${esc(to)}: ${r.length}`:'Эти плагины уже запрошены — ждём ответа'); loadReqs() }catch(e){ fail(e) }
}

  if(!r.updated){ m.querySelector('#ml').innerHTML=`<p class="muted">${esc(u.nick)} ещё ни разу не присылал список своих плагинов (он появится, когда ${esc(u.nick)} откроет прогу).</p>`; return }
  if(!list.length){ m.querySelector('#ml').innerHTML=`<div class="okbox">У тебя есть всё, что есть у ${esc(u.nick)} (${r.total} плагинов) 👌</div>`; return }
  m.querySelector('#ml').innerHTML=`<div class="muted small">У ${esc(u.nick)} (${esc(u.os)}) ${r.total} плагинов, у тебя нет ${list.length}. Отметь нужные. ${u.os!==S.state.os?'Системы разные: придёт версия для твоей системы, если она есть в пакете плагина, иначе — установщик.':''}</div>
    <div class="row" style="margin-top:8px"><label class="switch small" style="margin:0"><input type="checkbox" id="all"> выделить всё</label><span class="spacer"></span><input id="flt" placeholder="поиск" style="width:200px"></div>
    <div style="max-height:46vh;overflow:auto;margin-top:6px"><table><tr><th></th><th>Плагин</th><th>Формат</th><th>Производитель</th></tr>${list.map((p,i)=>`<tr data-n="${esc(p.name.toLowerCase())}"><td><input type="checkbox" style="width:auto" data-i="${i}"></td><td><b>${esc(p.name)}</b>${p.version?` <span class="muted small">${esc(p.version)}</span>`:''}</td><td><span class="tag">${esc(p.format)}</span></td><td class="muted small">${esc(p.vendor||'')}</td></tr>`).join('')}</table></div>
    <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="primary" id="go" disabled>⬇ Скачать выбранные</button></div>`;
  const boxes=[...m.querySelectorAll('input[data-i]')], go=m.querySelector('#go');
  const upd=()=>{ const n=boxes.filter(b=>b.checked).length; go.disabled=!n; go.textContent=`⬇ Скачать выбранные (${n})` };
  boxes.forEach(b=>b.onchange=upd);
  m.querySelector('#all').onchange=e=>{ boxes.forEach(b=>{ if(b.closest('tr').style.display!=='none') b.checked=e.target.checked }); upd() };
  m.querySelector('#flt').oninput=e=>{ const q=e.target.value.toLowerCase(); m.querySelectorAll('tr[data-n]').forEach(tr=>tr.style.display=tr.dataset.n.includes(q)?'':'none') };
  go.onclick=async()=>{ const items=boxes.filter(b=>b.checked).map(b=>list[+b.dataset.i]).map(p=>({plugin:p.name,format:p.format,vendor:p.vendor||''}));
    try{ const res=await api('/api/plugin/request',{to:u.nick,items}); m.close();
      uiAlert(`Запрошено у ${u.nick}: ${res.length}.${u.sharing==='ask'?` ${u.nick} увидит запросы у себя в проге.`:' Он разрешил это заранее — плагины придут и установятся сами, когда его прога будет открыта.'}\n\nХод передачи — в окне «🔌 Передачи».`,'Запросы отправлены') }catch(e){ fail(e) } };
}
async function openTransfers(){
  if(!S.state.registered) return openRegister(true);
  const m=modal(`<div class="row" style="justify-content:space-between"><h2><span class="ic">🔌</span> Передачи плагинов</h2><button class="ghost sm" id="x">✕</button></div><div id="tl">Загружаю…</div>`);
  m.querySelector('.modal').classList.add('wide');
  m.querySelector('#x').onclick=()=>m.close();
  const load=async()=>{ await loadReqs(); const el=m.querySelector('#tl'); if(!el) return;
    el.innerHTML=(S.reqs||[]).length?reqTable(S.reqs.slice(0,100)):'<p class="muted">Пока ничего не передавали. Плагины можно скачать у друга во вкладке «Плагины» проекта или через «👥 Люди».</p>' };
  await load(); const t=setInterval(()=>{ if(!document.body.contains(m)) return clearInterval(t); load() },4000);
}
function renderFolders(el,f){ if(!el) return;
  el.innerHTML=`<table><tr><th>Папка</th><th>Откуда</th><th style="text-align:right">Плагинов</th></tr>${(f.folders||[]).filter(x=>x.exists).map(x=>`<tr><td class="mono">${esc(x.path)}</td><td><span class="tag ${/FL/.test(x.source)?'v':''}">${esc(x.source)}</span></td><td style="text-align:right">${x.count}</td></tr>`).join('')}</table>
  <div class="muted" style="margin-top:4px">Всего найдено плагинов: ${f.count}. ${f.dbCount?`В базе плагинов FL: ${f.dbCount}.`:'База плагинов FL не найдена ('+esc(f.db)+') — открой в FL «Manage plugins» и нажми «Find installed plugins».'} <a onclick="rescanFolders(this)">↻ пересканировать</a></div>` }
async function rescanFolders(a){ a.textContent='сканирую…'; const r=await api('/api/pluginfolders',{}).catch(()=>null); if(r) renderFolders(a.closest('#pfolders'),r) }
async function installTools(){ await runJob('/api/tools/install',{},{title:'Установка git / git-lfs'}) }
async function quitApp(){ if(await uiConfirm('Закрыть прогу?',{ok:'Закрыть'})){ await api('/api/quit',{}).catch(()=>{}); document.body.innerHTML='<div class="empty"><div>Прога закрыта. Вкладку можно закрыть.</div></div>' } }

window.addEventListener('focus', ()=>{ if(S.sel && !document.querySelector('.modal-bg')) loadProject(S.sel) });
refreshAll().then(pollNotes).catch(e=>{ $('#main').innerHTML='<div class="badbox">'+esc(e.message)+'</div>' });
</script>
</body>
</html>
