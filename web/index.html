<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FruityHub</title>
    <link rel="icon" type="image/png" href="/assets/icon?v=__V__" />
    <link rel="stylesheet" href="/static/css/app.css?v=__V__" />
  </head>
  <body>
    <div id="splash">
      <img src="/assets/icon?v=__V__" alt="" />
      <div style="font-weight: 800; font-size: 18px; color: #f1f2f4">FruityHub</div>
      <div class="row" style="gap: 8px"><span class="spin"></span><span class="t">Загружаю проекты…</span></div>
    </div>
    <header class="glass">
      <div class="logo" onclick="openAbout()" title="О программе">
        <img src="/assets/icon?v=__V__" alt="" onerror="this.outerHTML = '<span class=mark></span>'" />FruityHub
      </div>
      <span class="chip" id="who" style="cursor: pointer">—</span>
      <span class="spacer"></span>
      <span class="chip" id="toolsChip" style="display: none"></span>
      <button class="ghost" onclick="openPluginManager()">Плагины</button>
      <button class="ghost" onclick="openJournal()">Журнал</button>
      <button class="ghost" onclick="openSettings()">Настройки</button>
      <button
        class="ghost"
        id="helpBtn"
        onclick="openGuide()"
        title="Как пользоваться FruityHub (убрать — Настройки → Вид)"
      >
        ?
      </button>
      <button class="ghost" id="quitBtn" title="Закрыть" onclick="quitApp()" style="display: none">⏻</button>
    </header>
    <div class="wrap">
      <aside class="glass">
        <div id="invites"></div>
        <div class="stabs">
          <div class="stab sel" id="st_my" onclick="sideTab('my')">Мои проекты</div>
          <div class="stab" id="st_av" onclick="sideTab('av')">
            Доступные<span class="badge" id="avcnt" style="display: none"></span>
          </div>
        </div>
        <div class="sortbar" id="sortbar"></div>
        <div class="list" id="plist"></div>
        <div class="legend" id="legend"></div>
        <div class="list" id="alist" style="display: none"></div>
        <div class="bottom">
          <div class="row" style="flex-wrap: nowrap; gap: 6px">
            <button style="flex: 1" onclick="addProject()">＋ Добавить проект</button
            ><button title="Новая папка в списке" onclick="newGroup()">＋</button>
          </div>
        </div>
      </aside>
      <main id="main"></main>
    </div>
    <div id="modals"></div>
    <div class="tasks" id="tasks"></div>
    <div class="toasts" id="toasts"></div>

    <!--
      Код интерфейса — static/js (по файлу на часть экрана), оформление — static/css/app.css,
      тексты — static/i18n/ru.js (русский) и static/i18n/en.js (английский).
      Порядок подключения важен только для boot.js: он последний и запускает интерфейс.
    -->
    <script>
      window.FH_TOKEN = '__FLSYNC_TOKEN__';
    </script>
    <script src="/static/js/core.js?v=__V__"></script>
    <script src="/static/js/tasks.js?v=__V__"></script>
    <script src="/static/js/state.js?v=__V__"></script>
    <script src="/static/js/changelog.js?v=__V__"></script>
    <script src="/static/js/guide.js?v=__V__"></script>
    <script src="/static/js/project-list.js?v=__V__"></script>
    <script src="/static/js/available.js?v=__V__"></script>
    <script src="/static/js/people.js?v=__V__"></script>
    <script src="/static/js/project.js?v=__V__"></script>
    <script src="/static/js/project-tabs.js?v=__V__"></script>
    <script src="/static/js/talk.js?v=__V__"></script>
    <script src="/static/js/sync.js?v=__V__"></script>
    <script src="/static/js/project-plugins.js?v=__V__"></script>
    <script src="/static/js/settings.js?v=__V__"></script>
    <script src="/static/js/plugin-manager.js?v=__V__"></script>
    <script src="/static/js/background.js?v=__V__"></script>
    <script src="/static/js/dragdrop.js?v=__V__"></script>
    <script src="/static/js/keyboard.js?v=__V__"></script>
    <script src="/static/js/updates.js?v=__V__"></script>
    <script src="/static/js/devmode.js?v=__V__"></script>
    <script src="/static/js/i18n.js?v=__V__"></script>
    <script src="/static/js/about.js?v=__V__"></script>
    <script src="/static/js/installer.js?v=__V__"></script>
    <script src="/static/js/boot.js?v=__V__"></script>
  </body>
</html>
