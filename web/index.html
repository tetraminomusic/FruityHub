<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FruityHub</title>
<link rel="icon" type="image/png" href="/assets/icon?v=__V__">
<style>
:root{
  --bg:#0d0e11; --panel:rgba(16,17,22,.74); --panel2:rgba(40,43,52,.72); --solid:#1a1c21; --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.16);
  --text:#f1f2f4; --muted:#a3a7b0; --accent:#f7a531; --btn:#a95a14; --btn2:#bf6a1a; --accent2:#ffbe5c; --ok:#4cc38a; --warn:#f2c94c; --bad:#ef5d5d; --blue:#6cb2ff; --violet:#a78bfa;
  --r:12px; --blur:saturate(150%) blur(18px);
  font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; font-size:14px;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;color:var(--text);display:flex;flex-direction:column;user-select:none;-webkit-user-select:none;background:#0d0e11}
/* фон: фотография на всё окно, поверх затемнение, чтобы текст оставался чётким */
body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;background:#0d0e11 url('/assets/bg?v=__V__') center/cover no-repeat}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:rgba(10,11,14,var(--dim,.5))}
/* лёгкий режим (слабые компьютеры): без фотографии и размытия — окно занимает заметно меньше памяти */
body.lite{--panel:#17181d;--panel2:#262830;--blur:none}
body.lite::before{background:#0d0e11!important}body.lite::after{background:radial-gradient(90% 70% at 80% 0%,#2a1f10 0%,#111216 60%)!important}
body.lite *{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
body.lite .task,body.lite .menu,body.lite .modal{background:#1c1d23}
body.lite .modal-bg{background:rgba(0,0,0,.62)}
body.lite *:not(.spin):not(.bar i){transition:none!important;animation:none!important}
/* высокое качество: плавное появление окон, уведомлений и задач */
body:not(.lite) .modal{animation:popin .18s cubic-bezier(.2,.8,.3,1)}
body:not(.lite) .modal-bg{animation:fadein .15s ease-out}
body:not(.lite) .task{animation:slidein .22s cubic-bezier(.2,.8,.3,1)}
body:not(.lite) .toast{animation:fadein .2s ease-out}
body:not(.lite) .pitem,body:not(.lite) .tab,body:not(.lite) .prow{transition:background .15s,color .15s,border-color .15s}
@keyframes popin{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes slidein{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
body.nobg::before,body.nobg::after{background:radial-gradient(90% 70% at 80% 0%,#3a2a12 0%,#141518 55%);filter:none}
main>h1,main>.muted,main>.row{text-shadow:0 1px 3px rgba(0,0,0,.85),0 0 14px rgba(0,0,0,.6)}
input,textarea,.selectable,.mono,td{user-select:text;-webkit-user-select:text}
.glass{background:var(--panel);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
button{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line2);border-radius:9px;padding:7px 12px;cursor:pointer;white-space:nowrap;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:background .15s,border-color .15s}
button:hover{border-color:rgba(255,255,255,.32);background:rgba(60,64,75,.7)}
button.primary{background:var(--btn);color:#fff7ea;border-color:#d27a22;font-weight:650}
button.primary:hover{background:var(--btn2);border-color:#e08a30}
button.danger{background:rgba(90,26,26,.7);border-color:#8a3434;color:#ffc0c0}
button.ghost{background:transparent;border-color:transparent;color:var(--muted);-webkit-backdrop-filter:none;backdrop-filter:none}
button.ghost:hover{color:var(--text);background:rgba(255,255,255,.07)}
button.sm{padding:4px 9px;font-size:12px}
button:disabled{opacity:.45;cursor:default}
/* icons are semi-transparent and light up on hover */
.ic{opacity:.62;transition:opacity .15s;display:inline-block}
button:hover .ic,.pitem:hover .ic,.ghead:hover .ic,.tab:hover .ic,.sel .ic{opacity:1}
input,textarea,select{font:inherit;color:var(--text);background:rgba(8,9,12,.62);border:1px solid var(--line2);border-radius:9px;padding:8px 10px;width:100%}
select option{background:#1a1c21}
textarea{resize:vertical;min-height:60px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
label{display:block;color:var(--muted);font-size:12px;margin:10px 0 4px}
a{color:var(--blue);cursor:pointer}
header{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line)}
.logo{font-weight:800;letter-spacing:.2px;display:flex;align-items:center;gap:9px;font-size:15px}
.logo img{width:26px;height:26px;border-radius:7px;object-fit:cover;box-shadow:0 2px 10px rgba(0,0,0,.4)}
.logo .mark{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#f7a531,#e0662c);display:grid;place-items:center;color:#1a1205;font-size:14px}
.spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);font-size:12px;color:var(--muted)}
.wrap{flex:1;display:flex;min-height:0}
aside{width:270px;border-right:1px solid var(--line);display:flex;flex-direction:column}
aside .list{flex:1;overflow:auto;padding:8px}
.pitem{padding:9px 10px;border-radius:9px;cursor:pointer;display:flex;align-items:center;gap:8px}
.pitem:hover{background:rgba(255,255,255,.07)}
.pitem.sel{background:rgba(247,165,49,.16);box-shadow:inset 0 0 0 1px rgba(247,165,49,.35)}
.pitem .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{font-size:11px;border-radius:99px;padding:1px 6px;background:rgba(247,165,49,.22);color:var(--accent2)}
.badge.v{background:rgba(167,139,250,.22);color:#d6c9ff}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:var(--ok)} .dot.me{background:var(--accent)} .dot.other{background:var(--bad)}
.dot.none{background:transparent;box-shadow:inset 0 0 0 1.5px var(--muted)} .dot.local{background:#5aa9ff} .dot.behind{background:#f7d038} .dot.both{background:linear-gradient(90deg,#5aa9ff 50%,#f7d038 50%)}
.dot.mine{box-shadow:0 0 0 2px rgba(247,165,49,.55)}
.pitem .nn{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}
.pitem .art{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;padding:6px 10px;font-size:11px;color:var(--muted)} .legend span{display:inline-flex;align-items:center;gap:4px}
/* полосы прокрутки: тонкие и тёмные, без серого системного ползунка (Windows) */
*{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.18) transparent}
::-webkit-scrollbar{width:8px;height:8px;background:transparent}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:8px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.28);background-clip:padding-box;border:2px solid transparent}
::-webkit-scrollbar-corner{background:transparent}
html,body{overflow:hidden}
aside .bottom{padding:10px;display:grid;gap:6px;border-top:1px solid var(--line)}
main{flex:1;overflow:auto;padding:20px 26px}
h1{font-size:23px;margin:0;text-shadow:0 1px 12px rgba(0,0,0,.5)}
h3{margin:18px 0 8px;font-size:15px}
.muted{color:var(--muted)} .small{font-size:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.card{background:var(--panel);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin:12px 0}
.banner{display:flex;align-items:center;gap:12px;border-radius:var(--r);padding:12px 16px;border:1px solid var(--line);background:var(--panel);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.banner.me{border-color:rgba(247,165,49,.45);background:rgba(60,40,10,.62)}
.banner.other{border-color:rgba(239,93,93,.45);background:rgba(60,18,18,.62)}
.banner.free{border-color:rgba(76,195,138,.4);background:rgba(14,44,30,.6)}
.banner .big{font-size:16px;font-weight:600}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.actions button{padding:10px 16px}
.tabs{display:flex;gap:4px;border:1px solid var(--line);border-bottom-color:rgba(255,255,255,.06);margin-top:14px;overflow-x:auto;background:var(--panel);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-radius:var(--r) var(--r) 0 0;padding:0 6px}
.phead{margin:0;padding:12px 16px}
.phead h1{text-shadow:none}
.tab{padding:9px 14px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tab.sel{color:var(--text);border-color:var(--accent)}
.tab .cnt{font-size:11px;background:var(--panel2);border-radius:99px;padding:1px 7px;margin-left:5px}
.tab .cnt.bad{background:rgba(160,40,40,.6);color:#ffc4c4}
.tab .cnt.hot{background:rgba(247,165,49,.25);color:var(--accent2)}
#tabbody{background:var(--panel);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--line);border-top:0;border-radius:0 0 var(--r) var(--r);padding:4px 14px 14px}
#tabbody .card{background:rgba(255,255,255,.04);-webkit-backdrop-filter:none;backdrop-filter:none}
table{width:100%;border-collapse:collapse;margin-top:8px}
th{text-align:left;color:var(--muted);font-weight:500;font-size:12px;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:7px 8px;border-bottom:1px solid rgba(255,255,255,.06);vertical-align:top}
tr:hover td{background:rgba(255,255,255,.035)}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:5px;background:var(--panel2);color:var(--muted);white-space:nowrap}
.tag.ok{background:rgba(30,90,60,.6);color:#8ff0c0}.tag.bad{background:rgba(110,30,30,.6);color:#ffb0b0}.tag.warn{background:rgba(110,90,20,.55);color:#ffe28f}.tag.blue{background:rgba(30,70,120,.55);color:#b3d6ff}.tag.v{background:rgba(80,60,150,.5);color:#ddd0ff}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.ellip{max-width:520px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:10;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.modal{background:rgba(24,25,31,.86);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--line2);border-radius:16px;padding:20px 22px;width:min(660px,94vw);max-height:88vh;overflow:auto;box-shadow:0 24px 70px rgba(0,0,0,.6)}
.modal.wide{width:min(860px,96vw)}
.modal h2{margin:0 0 6px;font-size:18px}
.err{white-space:pre-wrap}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;color:var(--muted);gap:10px}
.empty .box{background:var(--panel);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--line);border-radius:16px;padding:26px 34px}
.warnbox{border-left:3px solid var(--warn);background:rgba(70,60,15,.62);padding:8px 12px;border-radius:7px;margin:6px 0;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.badbox{border-left:3px solid var(--bad);background:rgba(80,22,22,.66);padding:8px 12px;border-radius:7px;margin:6px 0;color:#ffd0d0}
.dbox{position:relative;padding-right:40px}.dbox .dx{position:absolute;right:6px;top:50%;transform:translateY(-50%);padding:3px 8px;opacity:.7}.dbox .dx:hover{opacity:1}
.metagrid{display:grid;grid-template-columns:150px 1fr;gap:14px;margin-top:8px;align-items:start}
.mcover{width:150px;height:150px;border-radius:10px;border:1px dashed var(--line2);overflow:hidden;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.2);margin-top:22px}
.mcover img{width:100%;height:100%;object-fit:cover}
.grid3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}
@media (max-width:700px){.metagrid{grid-template-columns:1fr}}
.glen{font-size:11px;color:var(--muted);margin-left:auto;margin-right:6px;font-variant-numeric:tabular-nums}
.tchip{font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid var(--line2);color:var(--text);background:rgba(255,255,255,.06);cursor:pointer;margin-left:6px;white-space:nowrap}
body.picking{cursor:progress}
.okbox{border-left:3px solid var(--ok);background:rgba(16,60,40,.6);padding:8px 12px;border-radius:7px;margin:6px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.switch{display:flex;align-items:center;gap:8px;margin:8px 0;cursor:pointer;color:var(--text);font-size:14px}
.switch input{width:auto}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:rgba(30,32,38,.9);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--line2);padding:10px 14px;border-radius:10px;z-index:30;max-width:420px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.top{display:grid;grid-template-columns:1fr 360px;gap:14px;margin-top:14px}
input[type=range]{accent-color:var(--accent)}
.sortbar{font-size:12px;color:var(--muted);padding:2px 12px 4px}.sortbar a{color:var(--text);cursor:pointer}
.upick{border:1px solid var(--line);border-radius:9px;max-height:220px;overflow:auto;padding:2px 6px}
.urow{display:flex;align-items:center;gap:8px;padding:5px 2px;margin:0;color:var(--text);font-size:13px;cursor:pointer}.urow input{width:auto;margin:0}
.droplist{border:1px solid var(--line);border-radius:9px;padding:4px 8px;max-height:180px;overflow:auto}
.drow{display:flex;align-items:center;gap:8px;padding:3px 0}.drow .mono{flex:1;min-width:0}
.dropping{outline:2px dashed var(--accent);outline-offset:-4px}
.devlog{font:12px/1.45 ui-monospace,Menlo,Consolas,monospace;max-height:58vh;overflow:auto;background:rgba(5,6,8,.75);border:1px solid var(--line);border-radius:9px;padding:6px 8px;user-select:text;-webkit-user-select:text}
.devlog .e{white-space:pre-wrap;word-break:break-all;padding:1px 0}.devlog .e.err{color:#ff9d9d}.devlog .k{display:inline-block;min-width:38px;color:var(--blue)}.devlog .t{color:var(--muted)}
.upbar{display:flex;align-items:center;gap:10px;padding:8px 14px;background:rgba(247,165,49,.16);border-bottom:1px solid rgba(247,165,49,.35)}
.launch{display:flex;flex-direction:column;gap:8px;justify-content:center}
.launch .big{font-size:16px;padding:12px 16px}
.preview{border:1px dashed rgba(255,255,255,.22);border-radius:var(--r);padding:12px 14px;background:var(--panel);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);transition:.15s}
.preview.drag{border-color:var(--accent);background:rgba(60,40,10,.6)}
.preview audio{width:100%;height:36px;margin:6px 0}
.stage{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;background:rgba(80,60,150,.55);color:#e0d6ff;font-size:12px;font-weight:600}
.cm{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.cm .av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;flex:none;color:#1a1205}
.cm .body{flex:1;min-width:0}
.cm .text{white-space:pre-wrap;word-wrap:break-word;margin-top:3px;user-select:text;-webkit-user-select:text}
.cm.done .text{text-decoration:line-through;color:var(--muted)}
.cm input[type=checkbox]{width:18px;height:18px;margin-top:6px;accent-color:var(--ok)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:9px;overflow:hidden}
.seg button{border:0;border-radius:0;background:transparent;color:var(--muted)}
.seg button.on{background:var(--panel2);color:var(--text)}
.tasks{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:25;width:360px;max-width:calc(100vw - 32px);overflow-y:auto;overscroll-behavior:contain;padding-right:2px}
.tasks .task,.toasts .toast{flex:none}
.stackmore{position:fixed;right:22px;z-index:26;font-size:11px;color:var(--muted);background:rgba(30,32,38,.9);border:1px solid var(--line2);border-radius:99px;padding:1px 8px;pointer-events:none}
.toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:30;max-width:440px;width:max-content;overflow-y:auto}
.toasts .toast{position:static;transform:none;left:auto;bottom:auto}
.busy{position:fixed;inset:0;z-index:9;background:rgba(8,9,12,.62);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:var(--text);font-size:16px;text-align:center;padding:20px}
.busy .spin{width:54px;height:54px;border-width:4px}
.busy .sub{color:var(--muted);font-size:13px;max-width:520px}
.dragall{position:fixed;inset:10px;z-index:9;border:3px dashed var(--accent);border-radius:18px;background:rgba(60,40,10,.35);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:650;pointer-events:none;text-shadow:0 1px 8px rgba(0,0,0,.7)}
.task{background:rgba(30,32,38,.86);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--line2);border-radius:12px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.task.ok{border-color:rgba(76,195,138,.5)}.task.err{border-color:#8a3434;background:rgba(55,20,20,.9)}
.task .t{display:flex;align-items:center;gap:8px;font-weight:600}
.task .s{color:var(--muted);font-size:12px;margin-top:4px;min-height:16px}
.task .bar{height:5px;border-radius:9px;background:rgba(255,255,255,.12);margin-top:8px;overflow:hidden}
.task .bar i{display:block;height:100%;background:var(--accent);border-radius:9px;transition:width .3s}
.task .bar.ind i{width:35%!important;animation:ind 1.2s ease-in-out infinite}
@keyframes ind{0%{margin-left:-35%}100%{margin-left:100%}}
.spin{width:14px;height:14px;border:2px solid #555;border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.details{white-space:pre-wrap;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:#c4c7ce;background:rgba(0,0,0,.4);border-radius:6px;padding:8px;margin-top:8px;max-height:180px;overflow:auto}
.ghead{display:flex;align-items:center;gap:6px;padding:7px 8px;border-radius:9px;cursor:pointer;color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.ghead:hover{background:rgba(255,255,255,.07);color:var(--text)}
.ghead .gn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ghead .more,.pitem .more{opacity:0;padding:0 4px;border-radius:5px}
.ghead:hover .more,.pitem:hover .more{opacity:.8}
.ghead .more:hover,.pitem .more:hover{background:rgba(255,255,255,.12);opacity:1}
.gbody{margin-left:10px;border-left:1px solid var(--line);padding-left:4px}
.drop{outline:2px dashed var(--accent);outline-offset:-2px;background:rgba(60,40,10,.6)!important}
.menu{position:fixed;z-index:40;background:rgba(30,32,38,.92);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--line2);border-radius:10px;padding:4px;min-width:200px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.menu div{padding:7px 10px;border-radius:6px;cursor:pointer}
.menu div:hover{background:rgba(255,255,255,.1)}
.menu .sep{height:1px;background:var(--line);margin:4px 0;padding:0}
.invite{margin:8px;border:1px solid rgba(247,165,49,.45);background:rgba(60,40,10,.66);border-radius:11px;padding:10px;font-size:13px}
.lookup{font-size:12px;margin-top:4px;min-height:16px}
.act{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.07);font-size:13px}
.act .tm{color:var(--muted);white-space:nowrap;font-size:12px;width:92px;flex:none}
.stabs{display:flex;gap:4px;padding:8px 8px 0}
.stab{flex:1;text-align:center;padding:7px 6px;border-radius:9px;cursor:pointer;color:var(--muted);font-size:13px}
.stab.sel{background:var(--panel2);color:var(--text)}
.stab .badge{margin-left:4px}

<body>
<header class="glass">
  <div class="logo"><img src="/assets/icon?v=__V__" alt="" onerror="this.outerHTML='<span class=mark></span>'">FruityHub</div>
  <span class="chip" id="who" style="cursor:pointer">—</span>
  <span class="spacer"></span>
  <span class="chip" id="toolsChip" style="display:none"></span>
  <button class="ghost" onclick="openPluginManager()">Плагины</button>
  <button class="ghost" onclick="openJournal()">Журнал</button>
  <button class="ghost" onclick="openSettings()">Настройки</button>
  <button class="ghost" id="helpBtn" onclick="openGuide()" title="Как пользоваться FruityHub (убрать — Настройки → Вид)">?</button>
  <button class="ghost" id="quitBtn" title="Закрыть" onclick="quitApp()" style="display:none">⏻</button>
</header>
<div class="wrap">
  <aside class="glass">
    <div id="invites"></div>
    <div class="stabs"><div class="stab sel" id="st_my" onclick="sideTab('my')">Мои проекты</div><div class="stab" id="st_av" onclick="sideTab('av')">Доступные<span class="badge" id="avcnt" style="display:none"></span></div></div>
    <div class="sortbar" id="sortbar"></div>
    <div class="list" id="plist"></div>
    <div class="legend" id="legend"></div>
    <div class="list" id="alist" style="display:none"></div>
    <div class="bottom">
      <div class="row" style="flex-wrap:nowrap;gap:6px"><button style="flex:1" onclick="addProject()">＋ Добавить проект</button><button title="Новая папка в списке" onclick="newGroup()">＋</button></div>
    </div>
  </aside>
  <main id="main"></main>
</div>
<div id="modals"></div>
<div class="tasks" id="tasks"></div>
<div class="toasts" id="toasts"></div>

<script>
const TOKEN_URL='https://github.com/settings/tokens/new?scopes=repo,delete_repo&description=FruityHub';
const TOKEN = "__FLSYNC_TOKEN__";
const STAGES = ["Идея","Набросок","Аранжировка","Запись","Сведение","Мастеринг","Готово"];
let S = {state:null, sel:null, proj:null, analysis:null, history:null, comments:null, preview:null, previewErr:null, previewProgress:null,
         tab:'changes', showService:false, notes:{}, invites:[], incoming:[], ready:[], busy:{}, followed:{}, shownReq:{}, trashSel:{}, ckind:'note', cfilter:'all'};
const BG=new Image(); BG.onerror=()=>document.body.classList.add('nobg'); if(!document.body.classList.contains('lite')) BG.src='/assets/bg?v=__V__';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtSize = n => n==null?'':n<1024?n+' Б':n<1048576?(n/1024).toFixed(0)+' КБ':n<1073741824?(n/1048576).toFixed(1)+' МБ':(n/1073741824).toFixed(2)+' ГБ';
const fmtTime = t => new Date(t*1000).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
const enc = x => encodeURIComponent(x).replace(/'/g,'%27');
const color = name => { let h=0; for(const c of name||'') h=(h*31+c.charCodeAt(0))%360; return `hsl(${h} 70% 62%)` };

// окно выбора папки/файла — только одно за раз: пока открыто, повторные нажатия ничего не открывают
const isPicker=(path,body)=>/\/api\/pick/.test(path)||(body&&body.action==='pick');
async function api(path, body){
  if(isPicker(path,body)){
    if(S.picking){ toast('Окно выбора уже открыто — оно может быть за окном FruityHub'); return {} }
    S.picking=true; document.body.classList.add('picking');
    try{ return await apiRaw(path, body) } finally { S.picking=false; document.body.classList.remove('picking') }
  }
  return apiRaw(path, body);
}
async function apiRaw(path, body){
  const opt = {method: body===undefined?'GET':'POST', headers:{'X-FLSync':TOKEN}};
  if (body!==undefined){opt.body=JSON.stringify(body);opt.headers['Content-Type']='application/json'}
  const r = await fetch(path,opt); const j = await r.json().catch(()=>({error:'bad response'}));
  if(!r.ok) throw new Error(j.error||r.statusText); return j;
}
// сколько держать уведомления (Настройки → Вид): 0 — пока не закрою
function noteSec(){ const v=S.state?.config?.toastSec; return v==null||v===''?4:+v }
function toast(msg, ms=3500){const d=document.createElement('div');d.className='toast';d.innerHTML=msg;$('#toasts').prepend(d);
  const sec=noteSec(), t=sec===0?Math.max(ms,10000):Math.max(ms,sec*1000); setTimeout(()=>{ d.remove(); stackFit() },t); stackFit(); return d}
// не больше 3 уведомлений на экране: новые сверху, остальные — прокруткой вниз
function stackFit(){
  for(const id of ['tasks','toasts']){ const box=$('#'+id); if(!box) continue;
    const kids=[...box.children]; let h=0; kids.slice(0,3).forEach((k,i)=>h+=k.offsetHeight+(i?(id==='tasks'?8:6):0));
    box.style.maxHeight=kids.length>3?(h+2)+'px':'calc(100vh - 32px)';
    let more=document.getElementById(id+'More');
    if(kids.length>3){ if(!more){ more=document.createElement('div'); more.id=id+'More'; more.className='stackmore'; document.body.appendChild(more) }
      more.textContent='ещё '+(kids.length-3)+' ↓ прокрути'; const r=box.getBoundingClientRect();
      if(id==='toasts'){ more.style.right='auto'; more.style.left=(r.left+r.width/2-40)+'px' } more.style.top=(r.top-20)+'px' }
    else if(more) more.remove();
  }
}
for(const id of ['tasks','toasts']) new MutationObserver(()=>stackFit()).observe(document.getElementById(id),{childList:true,subtree:true,characterData:true});
window.addEventListener('resize',()=>stackFit());
// загрузка на весь экран (перетащили папку — видно, что она добавляется)
function busyOverlay(text, sub=''){
  const d=document.createElement('div'); d.className='busy'; d.innerHTML=`<span class="spin"></span><div class="bt">${esc(text)}</div><div class="sub">${esc(sub)}</div>`;
  document.body.appendChild(d);
  return {set:(t,s2='')=>{ d.querySelector('.bt').textContent=t; d.querySelector('.sub').textContent=s2 }, hide:()=>d.style.display='none', show:()=>d.style.display='', close:()=>d.remove()};
}
setInterval(()=>api('/api/ping',{}).catch(()=>{}),20000); api('/api/ping',{}).catch(()=>{});

// External links open in the system browser (inside the app window they would go nowhere)
document.addEventListener('click', e=>{
  const a=e.target.closest('a[href]'); if(!a) return;
  const h=a.getAttribute('href'); if(/^https?:\/\//.test(h)){ e.preventDefault(); api('/api/openurl',{url:h}).catch(()=>{}) }
});

// ---------- dialogs (own ones: WKWebView ignores alert/confirm/prompt) ----------
function modal(html, onclose){
  const bg=document.createElement('div');bg.className='modal-bg';
  bg.innerHTML=`<div class="modal">${html}</div>`;
  bg.close=()=>{bg.remove(); onclose&&onclose()};
  bg.addEventListener('mousedown',e=>{if(e.target===bg && !bg.busy && !bg.sticky) bg.close()});
  $('#modals').appendChild(bg); return bg;
}
function uiAlert(msg, title='Ошибка'){ return new Promise(res=>{ const m=modal(`<h2>${esc(title)}</h2><div class="err">${esc(msg)}</div><div class="row" style="justify-content:flex-end;margin-top:14px"><button class="primary" id="ok">Понятно</button></div>`, res); m.querySelector('#ok').onclick=()=>m.close(); m.querySelector('#ok').focus() }) }
function uiConfirm(msg, {title='Точно?', ok='Да', cancel='Отмена', danger=false}={}){ return new Promise(res=>{ let v=false; const m=modal(`<h2>${esc(title)}</h2><div>${msg}</div><div class="row" style="justify-content:flex-end;margin-top:14px"><button id="no">${esc(cancel)}</button><button class="${danger?'danger':'primary'}" id="yes">${esc(ok)}</button></div>`, ()=>res(v)); m.querySelector('#no').onclick=()=>m.close(); m.querySelector('#yes').onclick=()=>{v=true;m.close()} }) }
function uiPrompt(title, {label='', value='', placeholder=''}={}){ return new Promise(res=>{ let v=null; const m=modal(`<h2>${esc(title)}</h2>${label?`<label>${esc(label)}</label>`:''}<input id="pv" value="${esc(value)}" placeholder="${esc(placeholder)}"><div class="row" style="justify-content:flex-end;margin-top:14px"><button id="no">Отмена</button><button class="primary" id="yes">OK</button></div>`, ()=>res(v)); const i=m.querySelector('#pv'); i.focus(); const go=()=>{v=i.value;m.close()}; m.querySelector('#yes').onclick=go; i.onkeydown=e=>{if(e.key==='Enter')go()}; m.querySelector('#no').onclick=()=>m.close() }) }
const fail = e => uiAlert(e.message||String(e));

// ---------- jobs ----------
// ---------- tasks: small cards with plain words and a progress bar ----------
function taskCard(title){
  const el=document.createElement('div'); el.className='task';
  el.innerHTML=`<div class="t"><span class="spin"></span><span class="tt">${esc(title)}</span></div><div class="s">Начинаю…</div><div class="bar ind"><i style="width:0"></i></div>`;
  $('#tasks').prepend(el); return el;
}
function paintTask(el, j){
  const last=(j.steps||[])[(j.steps||[]).length-1]||'';
  // «Отменить» — у скачивания проекта
  let cb=el.querySelector('.tcancel');
  if(j.cancellable && !cb){ cb=document.createElement('button'); cb.className='ghost sm tcancel'; cb.textContent='Отменить'; cb.title='Остановить скачивание — недокачанная папка удалится';
    cb.onclick=async()=>{ if(!await uiConfirm('Остановить скачивание? Недокачанная папка проекта удалится — скачать можно будет заново из «Доступных».',{title:'Отменить скачивание',ok:'Остановить',danger:true})) return;
      cb.disabled=true; cb.textContent='Отменяю…'; try{ await api('/api/job/cancel',{id:j.id}) }catch(e){ fail(e) } };
    const t=el.querySelector('.t'); const sp=document.createElement('span'); sp.className='spacer'; t.append(sp,cb) }
  else if(!j.cancellable && cb){ cb.previousElementSibling?.remove(); cb.remove() }
  const p=j.progress;
  el.querySelector('.s').textContent = p ? p.label + (p.pct>=0?` — ${p.pct}%`:'') : (last||'Работаю…');
  const bar=el.querySelector('.bar');
  if(p && p.pct>=0){ bar.classList.remove('ind'); bar.querySelector('i').style.width=p.pct+'%' } else bar.classList.add('ind');
}
function finishTask(el, j){
  const bar=el.querySelector('.bar'); bar.remove();
  const tt=el.querySelector('.t');
  if(j.cancelled){
    tt.innerHTML=`<span class="tt">${esc(j.title)} — отменено</span><span class="spacer"></span><button class="ghost sm" onclick="this.closest('.task').remove()">✕</button>`;
    el.querySelector('.s').textContent='Недокачанная папка удалена.';
    setTimeout(()=>{ el.style.transition='opacity .4s'; el.style.opacity=0; setTimeout(()=>el.remove(),400) }, Math.max(3,noteSec()||4)*1000);
    return;
  }
  if(j.error){
    el.classList.add('err');
    tt.innerHTML=`<span class="tt">${esc(j.title)} — не получилось</span><span class="spacer"></span><button class="ghost sm" onclick="this.closest('.task').remove()">✕</button>`;
    const fx=j.fix;
    el.querySelector('.s').innerHTML=`<div style="color:#ffc4c4;font-size:13px;margin-top:2px">${esc(j.error)}</div>`+
      (fx&&fx.kind==='exists'?`<div class="row" style="gap:6px;margin:8px 0 4px">${fx.same?'<button class="sm primary" data-fx="add">Открыть его</button>':''}<button class="sm ${fx.same?'':'primary'}" data-fx="trash">Удалить папку и скачать заново</button><button class="sm ghost" data-fx="open">Показать папку</button></div>`:'')+(j.details?`<a class="small muted" onclick="this.nextElementSibling.hidden=!this.nextElementSibling.hidden">Подробности для знающих</a><div class="details" hidden>${esc(j.details)}</div>`:'');
    el.querySelectorAll('[data-fx]').forEach(b=>b.onclick=async()=>{
      const k=b.dataset.fx;
      if(k==='open') return api('/api/project/open',{path:fx.path}).catch(fail);
      if(k==='add'){ try{ await api('/api/projects/add',{path:fx.path}); el.remove(); S.sel=fx.path; S.comments=null; sideTab('my'); await refreshAll() }catch(e){ fail(e) } return }
      if(!await uiConfirm(`Папка <span class="mono">${esc(fx.path)}</span> уйдёт в Корзину целиком (оттуда можно вернуть)${fx.same?'':' — проверь, что там нет ничего нужного'}, и проект скачается заново.`,{title:'Удалить папку и скачать заново',ok:'Удалить и скачать',danger:true})) return;
      try{ await api('/api/clone/trash-existing',{path:fx.path}); el.remove(); el.retry&&el.retry() }catch(e){ fail(e) } });
  } else {
    el.classList.add('ok');
    tt.innerHTML=`<span style="color:var(--ok)">✓</span><span class="tt">${esc(j.title)}</span><span class="spacer"></span><button class="ghost sm" onclick="this.closest('.task').remove()">✕</button>`;
    const st=(j.steps||[]).filter(x=>!/^✓/.test(x)).slice(-3);
    el.querySelector('.s').innerHTML = st.length? st.map(x=>`<div>${esc(x)}</div>`).join('') : 'Готово';
    const sec=noteSec();
    if(sec>0) setTimeout(()=>{ el.style.transition='opacity .4s'; el.style.opacity=0; setTimeout(()=>el.remove(),400) }, st.some(x=>x.startsWith('Внимание'))?Math.max(9000,sec*2000):sec*1000);
  }
}
async function followJob(id, title, onDone, retry){
  S.followed[id]=1;
  const el=taskCard(title); el.retry=retry;
  for(;;){
    let j; try{ j=await api('/api/job?id='+id) }catch(e){ await new Promise(r=>setTimeout(r,1000)); continue }
    if(title!==j.title) el.querySelector('.tt').textContent=j.title;
    if(!j.done){ paintTask(el,j); await new Promise(r=>setTimeout(r,400)); continue }
    finishTask(el,j);
    const r=j.result||{};
    if(r.already) toast('Этот проект уже скачивается — смотри соседнюю задачу');
    if(!j.error && r.conflicts && r.conflicts.length) showConflicts(r.conflicts);
    onDone && onDone(j); refreshAll(); return j;
  }
}
async function runJob(path, body, {title, onDone}={}){
  let job; try{ job = await api(path, body) }catch(e){ fail(e); return null }
  const j=await followJob(job.id, title||job.title, onDone, ()=>runJob(path, body, {title, onDone}));
  // проект здесь и на GitHub начаты отдельно — спрашиваем, какую версию оставить, и повторяем
  if(j && !j.error && j.result && j.result.needChoice==='unrelated' && body && !body.resolve){
    const how=await chooseVersion(); if(!how) return j;
    return runJob(path, {...body, resolve:how}, {title, onDone});
  }
  return j;
}
function chooseVersion(){
  return new Promise(res=>{
    const m=modal(`<h2>Какую версию оставить?</h2>
      <div class="muted small">Проект на этом компьютере и на GitHub начаты отдельно (например, папку скопировали и подключили заново) — у них разные истории, и git не может их просто сложить.</div>
      <label class="radio on"><input type="radio" name="vv" value="theirs" checked><span><b>Только версию с GitHub</b><div class="muted small">Проект станет как на GitHub. Твои отличающиеся файлы не пропадут — сохранятся в папку <b>Backup</b> проекта.</div></span></label>
      <label class="radio"><input type="radio" name="vv" value="mine"><span><b>Только мою версию</b><div class="muted small">Твоя версия останется и при отправке заменит ту, что на GitHub (история на GitHub сохранится — старое можно будет вернуть из «Истории»).</div></span></label>
      <label class="radio"><input type="radio" name="vv" value="both"><span><b>Обе</b><div class="muted small">Одинаковые файлы сольются; где .flp разные — с GitHub под исходным именем, твой рядом копией. Потом выберешь, какой оставить.</div></span></label>
      <div class="row" style="justify-content:flex-end;margin-top:12px"><button id="no">Отмена</button><button class="primary" id="yes">Продолжить</button></div>`);
    m.querySelectorAll('input[name=vv]').forEach(i=>i.onchange=()=>m.querySelectorAll('.radio').forEach(l=>l.classList.toggle('on',l.querySelector('input').checked)));
    m.querySelector('#no').onclick=()=>{ m.close(); res(null) };
    m.querySelector('#yes').onclick=()=>{ const v=m.querySelector('input[name=vv]:checked').value; m.close(); res(v) };
  });
}
// после конфликта: по каждому файлу — оставить версию с GitHub, свою или обе
function showConflicts(list){
  const path=S.sel;
  const m=modal(`<h2>Вы оба поменяли одно и то же</h2>
    <div class="muted small">Сейчас под исходным именем лежит версия с GitHub, твоя — копией «(конфликт — …)» в папке проекта <span class="mono">.flsync/conflicts</span>. Выбери по каждому файлу, что оставить, или оставь обе и сравни в FL Studio.</div>
    <table style="margin-top:8px">${list.map((c,i)=>`<tr data-i="${i}"><td class="small"><b>${esc(c.replace(/^\.flsync\/conflicts\//,'').replace(/ \(конфликт — [^)]*\)(\.[^.]*)$/,'$1'))}</b><div class="muted">${esc(c)}</div></td>
      <td style="white-space:nowrap"><button class="sm ghost" data-open="1" title="Открыть твою версию в FL Studio, чтобы сравнить">Открыть мою</button> <button class="sm" data-k="theirs">С GitHub</button> <button class="sm" data-k="mine">Мою</button> <button class="sm ghost" data-k="both">Обе</button></td></tr>`).join('')}</table>
    <div class="muted small" style="margin-top:6px">Выбор «Мою» уйдёт на GitHub при следующей отправке.</div>
    <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="primary" id="ok">Готово</button></div>`);
  m.querySelector('#ok').onclick=()=>m.close();
  m.querySelectorAll('tr[data-i] [data-open]').forEach(b=>b.onclick=()=>api('/api/project/open-file',{path,rel:list[+b.closest('tr').dataset.i]}).catch(fail));
  m.querySelectorAll('tr[data-i] button[data-k]').forEach(b=>b.onclick=async()=>{
    const tr=b.closest('tr'), c=list[+tr.dataset.i], k=b.dataset.k;
    if(k!=='both'){ try{ await api('/api/project/conflict-keep',{path,copy:c,keep:k}) }catch(e){ return fail(e) } }
    tr.querySelector('td:last-child').innerHTML=`<span class="tag ok">${k==='theirs'?'оставлена с GitHub':k==='mine'?'оставлена твоя':'оставлены обе'}</span>`;
    if(S.sel) loadProject(S.sel);
  });
}
// job without a modal (progress shown inline)
async function silentJob(path, body, onTick){
  const job = await api(path, body);
  for(;;){ const j = await api('/api/job?id='+job.id); onTick && onTick(j); if(j.done){ if(j.error) throw new Error(j.error); return j } await new Promise(r=>setTimeout(r,400)) }
}

// ---------- state ----------
async function refreshAll(){
  S.state = await api('/api/state');
  const st=S.state;
  renderWho();
  setDim(st.config.bgDim||50); renderDevBtn();
  $('#quitBtn').style.display = st.windowed ? 'none' : '';
  $('#helpBtn').style.display = st.config.hideHelp ? 'none' : '';
  const t=st.tools, tc=$('#toolsChip');
  if(!t.gitOk||!t.lfsOk){ tc.style.display=''; tc.innerHTML=`<span style="color:var(--warn)">${!t.gitOk?'нет git':'нет git-lfs'}</span> <a onclick="installTools()">установить</a>` } else tc.style.display='none';
  renderList(); renderInvites();
  if(S.side==='av' || (st.registered && !S.avail)) loadAvailable(true);
  if(S.sel) await loadProject(S.sel); else renderMain();
  if(!S.introShown){ S.introShown=true;
    if(!st.config.guideSeen){ api('/api/settings',{guideSeen:true,seenVersion:st.version}).catch(()=>{}); st.config.guideSeen=true; st.config.seenVersion=st.version; await openGuide(true) }
    else if(st.version && st.version!=='dev' && st.config.seenVersion!==st.version){ api('/api/settings',{seenVersion:st.version}).catch(()=>{}); st.config.seenVersion=st.version; openWhatsNew(true) }
  }
  if(!st.registered && !S.askedName){ S.askedName=true; openRegister(true) }
}
// ---------- знакомство и «Что нового» ----------
const GUIDE=[
  ['Что такое FruityHub', `Программа для совместной работы над проектами FL Studio. Каждый проект хранится в приватном репозитории на твоём GitHub со всей историей версий, а друзья получают его одной кнопкой. Плагины друг другу можно передавать прямо из программы.`],

function openGuide(first){
  return new Promise(res=>{
    let i=0;
    const m=modal(`<div class="row" style="justify-content:space-between"><h2 style="margin:0">${first?'Добро пожаловать в FruityHub':'Как пользоваться FruityHub'}</h2><button class="ghost sm" id="x">✕</button></div>
      <div class="muted small" id="gi"></div><h3 id="gt" style="margin-top:6px"></h3><div id="gb" style="line-height:1.55;min-height:110px"></div>
      <div class="row" style="margin-top:12px"><span class="muted small" id="gn"></span><span class="spacer"></span><button id="gp">Назад</button><button class="primary" id="gx">Дальше</button></div>`);
    m.querySelector('.modal').style.width='min(620px,94vw)';
    const draw=()=>{ const [t,b]=GUIDE[i]; m.querySelector('#gt').textContent=t; m.querySelector('#gb').innerHTML=b;
      m.querySelector('#gn').textContent=(i+1)+' из '+GUIDE.length; m.querySelector('#gp').disabled=i===0;
      m.querySelector('#gx').textContent=i===GUIDE.length-1?(first?'Начать':'Готово'):'Дальше' };
    const done=()=>{ m.close(); res() };
    m.querySelector('#x').onclick=done;
    m.querySelector('#gp').onclick=()=>{ if(i>0){ i--; draw() } };
    m.querySelector('#gx').onclick=()=>{ if(i<GUIDE.length-1){ i++; draw() } else done() };
    draw();
  });
}

// цвет точки: занят ли другом, есть ли новое на GitHub, есть ли твои неотправленные изменения, всё ли актуально
function projState(p){
  const n=S.notes[p.path]||{};
  if(p.lock && p.lock.user!==S.state.me) return ['other','в работе у '+p.lock.user+' — не открывай для правки'];
  const mine=p.lock&&p.lock.user===S.state.me;
  if(!p.isRepo||n.remote===false) return ['none','не синхронизируется (нет репозитория на GitHub)'];
  const local=(n.changed>0)||(n.ahead>0), behind=n.behind>0;
  const tail=mine?' · в работе у тебя':'';
  if(local&&behind) return ['both','есть и твои неотправленные изменения, и новое на GitHub — сначала «Получить»'+tail];
  if(behind) return ['behind','на GitHub есть новое — нажми «Получить»'+tail];
  if(local) return ['local','у тебя есть неотправленные изменения'+(n.changed?' ('+n.changed+' файлов)':'')+tail];
  if(n.checked===undefined) return ['ok','свободен'+tail];
  return ['ok','актуально: у тебя последняя версия'+tail];
}

const SORTS=[['manual','как добавлены'],['name','по названию А–Я'],['name-desc','по названию Я–А'],['modified','по дате изменения — новые сверху'],['modified-asc','по дате изменения — старые сверху']];
const SORT_SHORT={manual:'как добавлены',name:'А–Я','name-desc':'Я–А',modified:'сначала свежие','modified-asc':'сначала давние'};
function sortMode(){ return S.state?.config?.sortMode||'manual' }
function sortProjects(list){
  const m=sortMode(), byName=(a,b)=>a.name.localeCompare(b.name,'ru',{sensitivity:'base',numeric:true});
  const l=[...list];
  if(m==='name') l.sort(byName);
  else if(m==='name-desc') l.sort((a,b)=>byName(b,a));
  else if(m==='modified') l.sort((a,b)=>(b.modified||0)-(a.modified||0)||byName(a,b));
  else if(m==='modified-asc') l.sort((a,b)=>(a.modified||0)-(b.modified||0)||byName(a,b));
  return l;
}
// папки: по названию — по своему имени; по дате — по самому свежему (или самому старому) проекту внутри; пустые — в конце
function sortGroups(groups, ps){
  const m=sortMode(), byName=(a,b)=>a.name.localeCompare(b.name,'ru',{sensitivity:'base',numeric:true});
  const l=[...groups];
  if(m==='name') l.sort(byName);
  else if(m==='name-desc') l.sort((a,b)=>byName(b,a));
  else if(m.startsWith('modified')){
    const key=g=>{ const t=ps.filter(p=>p.group===g.id).map(p=>p.modified||0); return t.length?(m==='modified'?Math.max(...t):Math.min(...t)):null };
    l.sort((a,b)=>{ const ka=key(a), kb=key(b);
      if(ka===null||kb===null) return (ka===null)-(kb===null)||byName(a,b);
      return (m==='modified'?kb-ka:ka-kb)||byName(a,b) });
  }
  return l;
}

async function pollNotes(){
  if(document.hidden) return; // окно свёрнуто — не опрашиваем (догоним, когда развернут)
  let r; try{ r = await api('/api/notifications') }catch(e){ return }
  S.updating=r.updating||''; renderUpdateBar(r.update);
  S.notes=r.projects||{}; S.invites=r.invites||[]; S.incoming=r.incoming||[]; S.ready=r.ready||[]; S.toSend=r.toSend||[]; S.busy=r.busy||{}; S.serverError=r.serverError||'';
  renderList(); renderInvites(); renderWho();
  for(const q of S.incoming) if(!S.shownReq[q.id] && S.busy[q.id]!=='approving'){ S.shownReq[q.id]=1; askPermission(q) }
  for(const it of r.installers||[]) if(!S.shownReq['inst'+it.id]){ S.shownReq['inst'+it.id]=1; offerInstaller(it) }
  for(const rep of r.reports||[]) if(!S.shownReq['rep'+rep.id]){ S.shownReq['rep'+rep.id]=1; showReport(rep) }
  for(const inv of S.invites) if(!S.shownReq['inv'+inv.id]){ S.shownReq['inv'+inv.id]=1; acceptInvite(inv.id) }
  // background jobs (plugins sent/installed automatically) get their own cards
  api('/api/jobs').then(js=>{ for(const j of js) if(!j.done && !S.followed[j.id]) followJob(j.id, j.title, ()=>{ S.analysis=null; if(S.sel) loadProject(S.sel); if(S.tab==='plugins') loadReqs() }) }).catch(()=>{});
  const n=S.notes[S.sel];
  if(n && S.proj && n.behind!==S.proj.behind && !document.querySelector('.modal-bg')) loadProject(S.sel);
  if(n && S.tab==='talk' && n.unread) loadComments(false);
}

      <div class="muted small" style="margin-top:6px">Какие файлы идут через Git LFS — общая настройка для всех проектов: Настройки → GitHub.</div>
      <div style="margin-top:12px"><button class="primary" onclick="saveShared()">Сохранить</button></div></div>
      <div class="card"><h3 style="margin-top:0">Трек: название, артист, обложка</h3>

function renderTalk(){
  const c=S.comments;
  if(!c) return `<p class="muted">Загружаю…</p>`;
  const st=c.status||{};
  let list=c.comments||[];
  if(S.cfilter==='todo') list=list.filter(x=>x.kind==='todo'&&!x.done);
  const todoCnt=(c.comments||[]).filter(x=>x.kind==='todo'&&!x.done).length;
  return `<div class="grid2" style="margin-top:12px;grid-template-columns:2fr 1fr">
    <div>
      <div class="card" style="margin-top:0">
        <div class="row" style="justify-content:space-between"><div class="seg"><button class="${S.ckind==='note'?'on':''}" onclick="S.ckind='note';renderMain()">Заметка</button><button class="${S.ckind==='todo'?'on':''}" onclick="S.ckind='todo';renderMain()">Задача</button></div>
        <span class="muted small">⌘/Ctrl + Enter — отправить</span></div>
        <textarea id="ctext" style="margin-top:8px" oninput="S.drafts=S.drafts||{};S.drafts[S.sel]=this.value" placeholder="${S.ckind==='todo'?'Что нужно сделать: «дописать бридж», «перезаписать вокал во 2 куплете»…':'Что сейчас с проектом, идеи, что попробовать…'}" onkeydown="if((event.metaKey||event.ctrlKey)&&event.key==='Enter')postComment()">${esc((S.drafts||{})[S.sel]||'')}</textarea>
        <div class="row" style="justify-content:flex-end;margin-top:8px"><button class="primary" id="cpost" onclick="postComment()">Отправить</button></div>
      </div>
      <div class="row"><div class="seg"><button class="${S.cfilter==='all'?'on':''}" onclick="S.cfilter='all';renderMain()">Всё</button><button class="${S.cfilter==='todo'?'on':''}" onclick="S.cfilter='todo';renderMain()">Открытые задачи (${todoCnt})</button></div>
        <span class="spacer"></span><button class="ghost sm" onclick="loadComments(true)">↻ обновить</button></div>
      ${list.length?list.map(x=>`<div class="cm ${x.done?'done':''}">
        ${x.kind==='todo'?`<input type="checkbox" ${x.done?'checked':''} title="${x.done?'Сделано '+esc(x.doneBy):'Отметить выполненной'}" onchange="toggleTodo('${x.id}',this.checked)">`:`<div class="av" style="background:${color(x.author)}">${esc((x.author||'?')[0].toUpperCase())}</div>`}
        <div class="body"><div class="small"><b>${esc(x.author)}</b> <span class="muted">${fmtTime(x.time)}</span> ${x.kind==='todo'?`<span class="tag ${x.done?'ok':'warn'}">${x.done?'сделано · '+esc(x.doneBy):'задача'}</span>`:''}
          ${x.author===c.me?`<a class="muted small" style="float:right" onclick="delComment('${x.id}')">удалить</a>`:''}</div>
          <div class="text">${esc(x.text)}</div></div></div>`).join(''):`<p class="muted">${S.cfilter==='todo'?'Открытых задач нет':'Пока тихо. Напиши, что сейчас с треком и что нужно доделать.'}</p>`}
    </div>
    <div><div class="card" style="margin-top:0"><b>Состояние проекта</b>
      <label>Этап</label><select id="sstage">${['',...STAGES].map(s=>`<option ${s===st.stage?'selected':''} value="${esc(s)}">${s||'— не указан —'}</option>`).join('')}</select>
      <label>Коротко</label><textarea id="stext" placeholder="напр.: «дроп готов, нужен бридж и вокал»">${esc(st.text||'')}</textarea>
      <div class="row" style="justify-content:space-between;margin-top:8px"><span class="muted small">${st.by?`обновил ${esc(st.by)}, ${fmtTime(st.time)}`:''}</span><button onclick="saveStatus()">Сохранить</button></div></div>
      <div class="muted small">Комментарии и статус уходят на сервер сразу и не трогают файлы проекта — можно писать, даже когда трек открыт в FL.</div></div>
  </div>`;
}
async function postComment(){
  const t=$('#ctext').value.trim(); if(!t) return;
  $('#cpost').disabled=true;
  try{ await api('/api/project/comment',{path:S.sel,kind:S.ckind,text:t}); $('#ctext').value=''; if(S.drafts) delete S.drafts[S.sel]; await loadComments(false) }catch(e){ fail(e) }
  const b=$('#cpost'); if(b) b.disabled=false;
}
async function toggleTodo(id, done){ try{ await api('/api/project/comment/update',{path:S.sel,id,done}); loadComments(false) }catch(e){ fail(e); loadComments(false) } }
async function delComment(id){ if(!await uiConfirm('Удалить комментарий?',{ok:'Удалить',danger:true})) return; try{ await api('/api/project/comment/update',{path:S.sel,id,delete:true}); loadComments(false) }catch(e){ fail(e) } }
async function saveStatus(){ try{ await api('/api/project/status',{path:S.sel,stage:$('#sstage').value,text:$('#stext').value}); toast('Статус обновлён'); loadComments(false) }catch(e){ fail(e) } }

async function loadReqs(){ try{ const r=await api('/api/plugin/requests'); S.reqs=r.requests||[]; S.busy=r.busy||S.busy; if(S.tab==='plugins'&&S.sel) renderMain() }catch(e){ S.reqs=S.reqs||[] } }
const RS={pending:['ждёт ответа','warn'],approved:['разрешён — ждёт, когда оба в сети','blue'],streaming:['передаётся…','blue'],declined:['отказ','bad'],installed:['установлен','ok'],failed:['ошибка','bad'],cancelled:['отменён','']};
function renderPlugins(){
  if(!S.analysis) return `<p class="muted">Сканирую плагины… (первый раз может занять до минуты)</p>`;
  if(!S.reqs){ loadReqs() }
  const rows=S.analysis.plugins, me=S.state.me, myId=S.state.userId;
  const reqs=S.reqs||[];
  const machines=S.proj.machines||[];
  const osOf=u=>(machines.find(m=>m.user===u)||{}).os || (u===me?S.state.os:'?');
  const stTag={ok:'ok',missing:'bad','other-format':'warn',unknown:''};
  const stName={ok:'есть',missing:'нет','other-format':'другой формат',unknown:'?'};
  const users=[...new Set(rows.flatMap(r=>r.machines.map(m=>m.user)))];
  const myReq=name=>reqs.find(r=>r.from===myId&&r.plugin.toLowerCase()===name.toLowerCase()&&['pending','approved','streaming'].includes(r.status));
  const needs=r=>{ const m=r.machines.find(x=>x.user===me); return r.format!=='FL' && (!m||m.state!=='ok') && !myReq(r.name) };
  // per friend: everything this project needs that I don't have and he does
  const bulk={};
  for(const r of rows) if(needs(r)) for(const o of r.machines) if(o.user!==me&&o.state==='ok') (bulk[o.user]=bulk[o.user]||[]).push(r);
  // в таблице только состояние и главное действие; остальное — в карточке плагина (нажать на плагин)
  const cell=(r,u)=>{
    const m=r.machines.find(x=>x.user===u)||{state:'unknown'};
    let h=`<span class="tag ${stTag[m.state]}">${stName[m.state]}${m.version?' '+esc(m.version):''}</span>${m.note&&m.state!=='unknown'?`<div class="muted small">${esc(m.note)}</div>`:''}`;
    if(u!==me || r.format==='FL') return h;
    const q=myReq(r.name);
    if(q) return h+`<div style="margin-top:4px"><span class="tag blue">${q.status==='streaming'?'передаётся…':q.status==='approved'?'разрешён'+(q.toOnline?'':' — ждём '+esc(q.toNick)):'запрошен у '+esc(q.toNick)}</span></div>`;
    const lq=lastReq(r.name);
    if(lq&&lq.status==='installed'&&lq.partial) h+=`<div style="margin-top:4px"><span class="tag warn" title="Плагин встал, но не всё из его данных легло — открой карточку">установлен частично</span></div>`;
    if(m.state!=='ok'){
      const donors=(r.machines||[]).filter(x=>x.user!==me&&x.state==='ok');
      if(donors.length===1) h+=`<div style="margin-top:4px"><button class="sm" onclick="event.stopPropagation();requestPlugins('${enc(donors[0].user)}',[['${enc(r.name)}','${r.format}','${enc(r.vendor||'')}']])">Скачать у ${esc(donors[0].user)}</button></div>`;
      else if(donors.length>1) h+=`<div style="margin-top:4px"><button class="sm" onclick="event.stopPropagation();openPluginCard('${enc(r.name)}','${r.format}')">Скачать…</button></div>`;
    }
    return h;
  };
  const lastReq=name=>reqs.filter(r=>r.from===myId&&r.plugin.toLowerCase()===name.toLowerCase()).sort((a,b)=>b.updated-a.updated)[0];
  S.pluginRows={}; for(const r of rows) S.pluginRows[r.name+'|'+r.format]=r;
  S.bulk=bulk;
  // только передачи, запрошенные из этого проекта (тот же плагин для другого проекта — в окне «Передачи»)
  const projReqs=reqs.filter(q=>q.project&&q.project===S.proj.reqKey);
  return `<div class="muted small" style="margin:10px 0">Список собирается из .flp и записывается в <b>PLUGINS.txt</b> в корне проекта. Каждый участник при отправке публикует, какие плагины (и каких версий) стоят у него.
      ${S.analysis.machines<2?'<br><span style="color:var(--warn)">Пока известен только твой компьютер — данные друга появятся после его первой отправки.</span>':''}</div>
    <div class="row"><button onclick="rescan()">Пересканировать мои плагины</button>
      ${Object.entries(bulk).map(([u,list])=>`<button class="primary" onclick="requestBulk('${enc(u)}')">Скачать у ${esc(u)} всё недостающее (${list.length})</button>`).join('')}
      <a class="small" onclick="openPluginManager('settings')">где я ищу плагины →</a></div>
    ${rows.length?`<table><tr><th>Плагин</th><th>Формат</th>${users.map(u=>`<th>${esc(u)}${u===me?' (ты)':''}</th>`).join('')}<th>Где взять</th></tr>
    ${rows.map(r=>`<tr class="prow" onclick="openPluginCard('${enc(r.name)}','${r.format}')" title="Нажми — проверка, зависимости, переустановка, ссылка и файлы"><td><b class="pname">${esc(r.name)}</b>${r.vendor?`<div class="muted small">${esc(r.vendor)}</div>`:''}${r.problem?`<div class="small" style="color:var(--warn)">${esc(r.problem)}</div>`:''}</td>
      <td><span class="tag">${esc(r.format)}</span></td>${users.map(u=>`<td>${cell(r,u)}</td>`).join('')}
      <td class="small">${r.link?`<a href="${esc(r.link)}" onclick="event.stopPropagation()">ссылка</a>`:''}${(r.files||[]).length?` <span class="muted">файлов: ${r.files.length}</span>`:''}</td></tr>`).join('')}</table>
      <div class="muted small" style="margin-top:4px">Нажми на плагин — проверка, зависимости, переустановка, ссылка и файлы.</div>`:'<p class="muted">Плагинов не найдено.</p>'}
    ${projReqs.length?`<h3>Передачи плагинов этого проекта</h3>${reqTable(projReqs.slice(0,30))}`:''}
    <div class="card small muted">Плагин идёт с компьютера друга на твой: если вы в одной сети — напрямую по ней, иначе потоком через сервер FruityHub (там ничего не хранится). Поэтому оба компьютера должны быть включены и FruityHub открыт. Плагин сам ложится в папку, где у тебя лежат плагины этого формата, и добавляется в базу плагинов FL. Между одинаковыми системами плагин переносится и ставится сам. Между Mac и Windows — если в пакете плагина есть версия для обеих систем (так бывает у VST3), иначе друг пришлёт установщик, и FruityHub его запустит. Вместе с плагином переносятся его данные (пресеты, ресурсы из «Документов», ProgramData, AppData), если они не больше 2 ГБ. Большие библиотеки сэмплов и лицензии не переносятся — после установки FruityHub покажет, что ещё нужно сделать.</div>`;
}
function reqTable(list){
  const myId=S.state.userId;
  return `<table><tr><th>Когда</th><th>Плагин</th><th>Кто → у кого</th><th>Статус</th><th></th></tr>${list.map(r=>`<tr><td class="muted">${fmtTime(r.created)}</td><td>${esc(r.plugin)} <span class="tag">${esc(r.format)}</span></td><td>${esc(r.fromNick)} → ${esc(r.toNick)}</td>
      <td>${r.status==='installed'&&r.partial?'<span class="tag warn" title="Плагин встал, но не всё из его данных легло">установлен частично</span>':`<span class="tag ${RS[r.status]?.[1]||''}">${RS[r.status]?.[0]||r.status}</span>`}${r.note?`<div class="muted small">${esc(r.note)}</div>`:''}${r.status==='installed'&&r.from===myId?`<div><a class="small" onclick="openReport('${r.id}')">что установлено и проверено</a></div>`:''}</td>
      <td>${r.to===myId&&r.status==='pending'?(S.busy?.[r.id]==='approving'?'<span class="tag blue">разрешаю…</span>':`<button class="sm primary" onclick="reviewReq('${r.id}')">Ответить</button>`):''}
        ${r.status==='approved'?`<span class="muted small">${r.to===myId?(r.fromOnline?'сейчас уйдёт':esc(r.fromNick)+' не в сети'):(r.toOnline?'сейчас придёт':esc(r.toNick)+' не в сети')}</span>`:''}
        ${['pending','approved','streaming'].includes(r.status)?` <a class="small muted" onclick="cancelReq('${r.id}')">${r.status==='streaming'?'прервать':'отменить'}</a>`:''}
        ${['failed','cancelled'].includes(r.status)?` <button class="sm" onclick="retryReq('${r.id}')">Повторить</button>`:''}
        ${r.status==='installed'&&r.from===myId?` <a class="small muted" onclick="reinstallReq('${r.id}')" title="Плагин и все его данные придут заново и заменят твои">переустановить</a>`:''}
        ${r.status==='installed'&&r.from!==myId?` <a class="small muted" onclick="retryReq('${r.id}')" title="Передать этот плагин ещё раз">ещё раз</a>`:''}</td></tr>`).join('')}</table>`;
}
// items: [[encName, format, encVendor], ...]
async function requestPlugins(encTo, items){
  const to=decodeURIComponent(encTo);
  const list=items.map(([n,f,v])=>({plugin:decodeURIComponent(n),format:f,vendor:decodeURIComponent(v)}));
  const what=list.length===1?`плагин <b>${esc(list[0].plugin)}</b>`:`плагины (${list.length}): ${list.slice(0,8).map(x=>'<b>'+esc(x.plugin)+'</b>').join(', ')}${list.length>8?'…':''}`;
  // друг заранее разрешил скачивать у него плагины — лишний вопрос не задаём
  let donor=null; try{ donor=(await getUsers()).find(u=>u.nick===to) }catch(e){}
  const auto=donor&&(donor.sharing==='all'||donor.sharing==='members');
  if(!auto && !await uiConfirm(`Скачать ${what} с компьютера <b>${esc(to)}</b>? ${esc(to)} увидит запрос у себя и разрешит или откажет.`,{ok:'Отправить запрос',title:'Плагины от друга'})) return;
  try{ const r=await api('/api/plugin/request',{to,items:list,path:S.sel||''}); toast(r.length?(auto?`${esc(to)} разрешил передачу заранее — ${r.length===1?'плагин придёт':'плагины придут'} и ${r.length===1?'установится':'установятся'} сами`:`Запрошено у ${esc(to)}: ${r.length}`):'Эти плагины уже запрошены — ждём ответа',5000); loadReqs() }catch(e){ fail(e) }
}
function requestBulk(encU){ const list=(S.bulk||{})[decodeURIComponent(encU)]||[]; if(list.length) requestPlugins(encU, list.map(r=>[enc(r.name),r.format,enc(r.vendor||'')])) }
async function cancelReq(id){ const r=(S.reqs||[]).find(x=>x.id===id);
  if(r?.status==='streaming' && !await uiConfirm(`Прервать передачу <b>${esc(r.plugin)}</b>? Её можно будет повторить.`,{ok:'Прервать',danger:true})) return;
  try{ await api('/api/plugin/cancel',{id}); toast('Передача отменена'); loadReqs(); if(document.querySelector('#tl')&&S.trRefresh) S.trRefresh() }catch(e){ fail(e) } }
// карточка плагина: всё, что можно с ним сделать
function openPluginCard(encName, format){
  const name=decodeURIComponent(encName), r=(S.pluginRows||{})[name+'|'+format]; if(!r) return;
  const me=S.state.me, myId=S.state.userId, machines=S.proj?.machines||[];
  const osOf=u=>(machines.find(m=>m.user===u)||{}).os||(u===me?S.state.os:'?');
  const mine=r.machines.find(x=>x.user===me)||{state:'unknown'};
  const reqs=(S.reqs||[]).filter(q=>q.plugin.toLowerCase()===name.toLowerCase());
  const active=reqs.find(q=>q.from===myId&&['pending','approved','streaming'].includes(q.status));
  const others=r.machines.filter(x=>x.user!==me&&x.state==='ok');
  const sameOS=others.filter(o=>osOf(o.user)===S.state.os);
  const stName={ok:'есть',missing:'нет','other-format':'другой формат',unknown:'неизвестно'}, stTag={ok:'ok',missing:'bad','other-format':'warn',unknown:''};
  const act=[];
  if(r.format!=='FL'){
    if(active) act.push(`<div><span class="tag blue">${active.status==='streaming'?'передаётся…':active.status==='approved'?'разрешён — придёт, когда вы оба в сети':'запрошен у '+esc(active.toNick)}</span> <button class="sm ghost" data-a="cancel">Отменить</button></div>`);
    else if(mine.state==='ok'){
      act.push(`<div class="row"><button class="sm" data-a="check">Проверить</button><button class="sm" data-a="deps">Зависимости</button><button class="sm" data-a="diag" title="Подробный отчёт: где лежат файлы плагина, что уйдёт при передаче — чтобы сравнить два компьютера">Диагностика</button>
        ${sameOS.map(o=>`<button class="sm" data-a="reinstall" data-u="${esc(o.user)}" title="Плагин и все его данные придут заново и заменят твои">Переустановить у ${esc(o.user)}</button>`).join('')}<span class="spacer"></span><button class="sm danger" data-a="uninstall" title="Убрать плагин и его данные с этого компьютера (в Корзину)">Удалить у себя</button></div>`);
      const diff=others.filter(o=>o.version&&mine.version&&o.version!==mine.version);
      if(diff.length) act.push(`<div class="row">${diff.map(o=>`<button class="sm ghost" data-a="get" data-u="${esc(o.user)}" title="Твоя версия заменится, старая уйдёт в резервную копию">Взять версию ${esc(o.version)} у ${esc(o.user)}</button>`).join('')}</div>`);
      act.push(`<div class="muted small">«Проверить» — загружается ли плагин, хватает ли библиотек и папок, нужна ли активация. «Переустановить» — плагин и все его данные придут заново и заменят то, что есть.</div>`);
    } else if(others.length){
      act.push(`<div class="row">${others.map(o=>`<button class="sm primary" data-a="get" data-u="${esc(o.user)}">Скачать у ${esc(o.user)}</button>${osOf(o.user)!==S.state.os?`<span class="muted small">у него ${esc(osOf(o.user))} — пришлёт версию для твоей системы или установщик</span>`:''}`).join('')}</div>
        <label class="switch small"><input type="checkbox" id="lite" ${isLite(name)?'checked':''}> Без библиотеки пресетов — только сам плагин и то, без чего он не запустится</label>`);
    } else act.push('<div class="muted small">Ни у кого из участников этого плагина нет — возьми по ссылке ниже или у производителя.</div>');
  }
  const m=modal(`<div class="row" style="justify-content:space-between"><h2 style="margin:0">${esc(name)}</h2><button class="ghost sm" id="x">✕</button></div>
    <div class="muted small">${esc(r.vendor||'')} ${r.vendor?'·':''} <span class="tag">${esc(r.format)}</span>${r.problem?` <span style="color:var(--warn)">${esc(r.problem)}</span>`:''}</div>
    <table style="margin-top:8px">${r.machines.map(x=>`<tr><td>${esc(x.user)}${x.user===me?' (ты)':''} <span class="muted small">${esc(osOf(x.user))}</span></td><td><span class="tag ${stTag[x.state]||''}">${stName[x.state]||x.state}${x.version?' '+esc(x.version):''}</span>${x.note?` <span class="muted small">${esc(x.note)}</span>`:''}</td></tr>`).join('')}</table>
    ${act.length?`<h3>Действия</h3>${act.join('')}`:''}
    <h3>Ссылка и файлы</h3>
    <div class="small">${r.link?`<a href="${esc(r.link)}">${esc(r.link)}</a>`:'<span class="muted">Ссылки нет</span>'}${r.linkNote?`<div class="muted">${esc(r.linkNote)}</div>`:''}
      ${(r.files||[]).map(f=>`<div><a data-f="${esc(f.name)}" title="Скачать в «Загрузки»">${esc(f.name)}</a> <span class="muted">${fmtSize(f.size)}</span></div>`).join('')}</div>
    <div style="margin-top:6px"><button class="sm ghost" data-a="link">${r.link||(r.files||[]).length?'Изменить ссылку и файлы…':'+ Ссылка / файл…'}</button></div>
    ${reqs.length?`<h3>Передачи этого плагина</h3>${reqTable(reqs.slice(0,10))}`:''}`);
  m.querySelector('.modal').style.width='min(820px,94vw)';
  m.querySelector('#x').onclick=()=>m.close();
  const lt=m.querySelector('#lite'); if(lt) lt.onchange=e=>setLite(name,e.target.checked);
  const go=fn=>()=>{ m.close(); fn() };
  m.querySelectorAll('[data-a]').forEach(b=>b.onclick=go(()=>{ const u=b.dataset.u?enc(b.dataset.u):'';
    switch(b.dataset.a){
      case 'check': return checkPlugin(enc(name),format);
      case 'deps': return openDeps(enc(name),format);
      case 'diag': return pluginDiag(name,format);
      case 'reinstall': return reinstallPlugin(u,enc(name),format,enc(r.vendor||''));
      case 'get': return requestPlugins(u,[[enc(name),format,enc(r.vendor||'')]]);
      case 'cancel': return cancelReq(active.id);
      case 'link': return editLink(enc(name),enc(r.link||''),enc(r.linkNote||''));
      case 'uninstall': return uninstallPlugin(name,format);
    } }));
  m.querySelectorAll('[data-f]').forEach(a=>a.onclick=()=>getLinkFile(enc(name),enc(a.dataset.f)));
}
const REINSTALL_TXT='Плагин и <b>все</b> его данные (ресурсы, библиотеки, пути в реестре) придут заново и заменят то, что у тебя сейчас — даже то, что уже есть. Твои файлы с теми же именами уйдут в резервную копию (в системных папках просто заменятся).';
async function reinstallPlugin(encU, encName, format, encVendor){
  const u=decodeURIComponent(encU), name=decodeURIComponent(encName);
  if(!await uiConfirm(`Переустановить <b>${esc(name)}</b> с компьютера <b>${esc(u)}</b>?<br><br>${REINSTALL_TXT}`,{ok:'Переустановить',title:'Переустановка плагина'})) return;
  try{ const r=await api('/api/plugin/request',{to:u,path:S.sel||'',items:[{plugin:name,format,vendor:decodeURIComponent(encVendor),reinstall:true}]}); toast(r.length?`Запрошено у ${esc(u)} — придёт и переустановится`:'Этот плагин уже запрошен — дождись или отмени тот запрос'); loadReqs() }catch(e){ fail(e) } }
async function reinstallReq(id){ const r=(S.reqs||[]).find(x=>x.id===id);
  if(!await uiConfirm(`Переустановить <b>${esc(r?.plugin||'плагин')}</b>?<br><br>${REINSTALL_TXT}`,{ok:'Переустановить',title:'Переустановка плагина'})) return;
  try{ await api('/api/plugin/retry',{id,reinstall:true}); toast('Переустановлю, как только вы оба будете в сети'); loadReqs(); if(document.querySelector('#tl')&&S.trRefresh) S.trRefresh() }catch(e){ fail(e) } }
// удалить плагин у себя: что именно — галочками (сам плагин, его данные, запись в базе FL)
async function uninstallPlugin(name, format, after){
  const m=modal(`<h2>Удалить ${esc(name)}</h2><div id="ul" class="muted">Ищу файлы плагина…</div>
    <div class="row" style="justify-content:flex-end;margin-top:12px"><button id="no">Отмена</button><button class="danger" id="ok" disabled>Удалить</button></div>`);
  m.querySelector('.modal').style.width='min(780px,94vw)';
  m.querySelector('#no').onclick=()=>m.close();
  let plan; try{ plan=await api('/api/plugin/uninstall-plan',{name,format}) }catch(e){ m.querySelector('#ul').innerHTML=`<div class="badbox">${esc(e.message)}</div>`; return }
  const KIND={plugin:'Плагин',data:'Данные',fldb:'База FL'};
  m.querySelector('#ul').innerHTML=`<div class="small" style="color:var(--text)">Отмеченное уйдёт в Корзину — оттуда можно вернуть${plan.items.some(i=>i.admin)?' (из защищённых папок — в резервную папку FruityHub, понадобятся права администратора)':''}. Закрой FL Studio.</div>
    <div style="max-height:46vh;overflow:auto;margin-top:8px"><table>${plan.items.map((it,i)=>`<tr><td style="width:24px"><input type="checkbox" style="width:auto" data-i="${i}" ${it.checked?'checked':''}></td>
      <td><span class="tag ${it.kind==='plugin'?'bad':''}">${KIND[it.kind]||it.kind}</span></td><td class="mono small" style="word-break:break-all">${esc(it.path)}${it.why?`<div class="muted" style="font-family:inherit">${esc(it.why)}</div>`:''}</td>
      <td class="muted small" style="text-align:right;white-space:nowrap">${it.size?fmtSize(it.size):''}</td></tr>`).join('')}</table></div>
    <div class="muted small" style="margin-top:6px">Лицензии в системе и пути в реестре не трогаются. Без галочки — то, что может быть общим с другими плагинами (большие библиотеки).</div>`;
  const boxes=[...m.querySelectorAll('input[data-i]')], ok=m.querySelector('#ok');
  const upd=()=>{ const n=boxes.filter(b=>b.checked).length; ok.disabled=!n; ok.textContent=n?`Удалить (${n})`:'Удалить' };

async function addProject(){

const PM_TABS=[['mine','Мои плагины'],['people','Люди'],['transfers','Передачи'],['settings','Настройки']];
async function openPluginManager(tab){
  const m=modal(`<div class="row" style="justify-content:space-between"><h2 style="margin:0">Плагины</h2><button class="ghost sm" id="x">✕</button></div>
    <div class="seg" style="margin:10px 0 6px;flex-wrap:wrap">${PM_TABS.map(([k,t])=>`<button data-pt="${k}">${t}</button>`).join('')}</div><div id="pmb"></div>`);
  m.querySelector('.modal').style.width='min(980px,95vw)';
  m.querySelector('#x').onclick=()=>m.close();
  const body=m.querySelector('#pmb');
  let timer=null;
  const show=k=>{ clearInterval(timer); m.querySelectorAll('[data-pt]').forEach(b=>b.classList.toggle('on',b.dataset.pt===k)); try{ localStorage.setItem('pmTab',k) }catch(e){}
    body.innerHTML='<p class="muted">Загружаю…</p>';

    else { const load=async()=>{ if(!document.body.contains(m)) return clearInterval(timer); await loadReqs(); if(!body.isConnected) return;
        body.innerHTML=(S.reqs||[]).length?reqTable(S.reqs.slice(0,100)):'<p class="muted">Пока ничего не передавали. Плагины можно скачать у друга во вкладке «Плагины» проекта или во вкладке «Люди».</p>' };
      S.trRefresh=load; load(); timer=setInterval(load,4000) } };
  m.querySelectorAll('[data-pt]').forEach(b=>b.onclick=()=>show(b.dataset.pt));
  let t0=tab; if(!t0){ try{ t0=localStorage.getItem('pmTab') }catch(e){} } if(!PM_TABS.some(([k])=>k===t0)) t0='mine';

// Окно не знает, откуда папку перетащили, поэтому FruityHub ищет её на диске по имени и содержимому.
async function readDropped(dt){
  const out=[];
  for(const it of [...(dt.items||[])]){
    const en=it.webkitGetAsEntry?it.webkitGetAsEntry():null;
    if(!en) continue;
    if(en.isDirectory){
      const names=await new Promise(res=>{ en.createReader().readEntries(es=>res(es.map(e=>e.name)), ()=>res([])) });
      out.push({name:en.name, children:names.slice(0,200), dir:true});
    } else out.push({name:en.name, dir:false});
  }
  return out;
}
function hasFiles(e){ return [...(e.dataTransfer?.types||[])].includes('Files') }
function bindFolderDrop(el, plugins, onPaths){
  if(!el) return;
  // папку проекта можно бросить в любое место окна — рамка на всё окно, пока тащишь
  let hint=null, hintT=0;
  const showHint=()=>{ if(plugins) return; if(!hint){ hint=document.createElement('div'); hint.className='dragall'; hint.textContent='Отпусти — папка добавится как проект'; document.body.appendChild(hint) } clearTimeout(hintT); hintT=setTimeout(hideHint,250) };
  const hideHint=()=>{ if(hint){ hint.remove(); hint=null } };
  el.addEventListener('dragover', e=>{ if(hasFiles(e) && (plugins || !topModal())){ e.preventDefault(); e.stopPropagation(); el.classList.add('dropping'); showHint() } });
  el.addEventListener('dragleave', e=>{ if(e.target===el) el.classList.remove('dropping') });
  el.addEventListener('drop', async e=>{
    if(!hasFiles(e) || (!plugins && topModal())) return;
    e.preventDefault(); e.stopPropagation(); el.classList.remove('dropping'); hideHint();
    const items=await readDropped(e.dataTransfer);
    const dirs=items.filter(x=>x.dir);
    if(!dirs.length){ toast('Перетащи папку (не файл)'); return }
    const busy=plugins?null:busyOverlay('Добавляю «'+dirs[0].name+'»…','Ищу папку на диске');
    const t=plugins?toast('Ищу папку «'+esc(dirs[0].name)+'» на диске…',15000):null;
    const paths=[];
    try{
      for(const d of dirs){
        busy&&busy.set('Добавляю «'+d.name+'»…','Ищу папку на диске');
        let found=[]; try{ found=await api('/api/locate-dropped',{name:d.name,children:d.children,plugins}) }catch(er){}
        if(found.length===1) paths.push(found[0]);
        else if(found.length>1){ busy&&busy.hide(); const p=await choosePath(d.name, found); busy&&busy.show(); if(p) paths.push(p) }
        else {
          t&&t.remove(); busy&&busy.hide();
          if(await uiConfirm(`Не нашёл папку «${esc(d.name)}» на диске. Выбрать её вручную?`,{title:'Папка не найдена',ok:'Выбрать…'})){
            const r=await api('/api/pickfolder',{}).catch(()=>({})); if(r.path) paths.push(r.path) }
          busy&&busy.show();
        }
      }
      t&&t.remove();
      if(paths.length){ busy&&busy.set(paths.length>1?`Добавляю проекты (${paths.length})…`:'Добавляю «'+paths[0].split(/[\\/]/).pop()+'»…','Разбираю .flp, сэмплы и плагины'); await onPaths(paths) }
    } finally { busy&&busy.close() }
  });
}

  const m=modal(`<h2>Какая из папок «${esc(name)}»?</h2>${list.map((p,i)=>`<label class="radio"><input type="radio" name="cp" value="${i}" ${i?'':'checked'}><span class="mono">${esc(p)}</span></label>`).join('')}
    <div class="row" style="justify-content:flex-end;margin-top:12px"><button id="no">Отмена</button><button class="primary" id="ok">Эта</button></div>`, ()=>res(v));

function visibleProjects(){ return [...document.querySelectorAll('#plist .pitem')].map(el=>el.dataset.path) }
function scrollSelIntoView(){ const el=document.querySelector('#plist .pitem.sel'); if(el) el.scrollIntoView({block:'nearest'}) }
function topModal(){ const ms=document.querySelectorAll('#modals .modal-bg'); return ms[ms.length-1] }
function groupStarts(){ // первый проект каждой папки (и общего списка) — для Tab
  const out=[];

document.addEventListener('keydown', e=>{
  const mod=e.metaKey||e.ctrlKey, k=e.key.toLowerCase();
  const typing=/^(input|textarea|select)$/i.test(document.activeElement?.tagName||'') || document.activeElement?.isContentEditable;
  if(e.key==='Escape'){
    const menu=document.querySelector('.menu'); if(menu){ menu.remove(); e.preventDefault(); return }
    const m=topModal(); if(m && !m.busy){ e.preventDefault(); m.close(); return }
    return;
  }
  if(mod && e.shiftKey && (k==='n'||e.code==='KeyN')){ e.preventDefault(); if(!topModal()) newGroup(); return }
  if(mod && !e.shiftKey && (k==='n'||e.code==='KeyN')){ e.preventDefault(); if(!topModal()) addProject(); return }
  if(mod && !e.shiftKey && (k==='o'||e.code==='KeyO')){ e.preventDefault(); if(S.sel && !topModal()) api('/api/project/open',{path:S.sel}).catch(fail); return }
  if(typing || topModal() || mod || e.altKey) return;
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    if(S.side==='av') return;
    const list=visibleProjects(); if(!list.length) return;
    e.preventDefault();
    let i=list.indexOf(S.sel);
    i = i<0 ? 0 : Math.max(0, Math.min(list.length-1, i+(e.key==='ArrowDown'?1:-1)));
    if(list[i]!==S.sel) selectProject(enc(list[i]));
  } else if(e.key==='Tab'){
    if(S.side==='av') return;
    const starts=groupStarts(); if(!starts.length) return;
    e.preventDefault();
    const list=visibleProjects(), cur=list.indexOf(S.sel);
    let idx;
    if(!e.shiftKey){ idx=starts.findIndex(p=>list.indexOf(p)>cur); if(idx<0) idx=0 }
    else { const before=starts.filter(p=>list.indexOf(p)<cur); idx=before.length?starts.indexOf(before[before.length-1]):starts.length-1;
      // если стоим не на первом проекте папки — сначала к её началу
      const own=starts.filter(p=>list.indexOf(p)<=cur).pop(); if(own && own!==S.sel && e.shiftKey) idx=starts.indexOf(own) }
    selectProject(enc(starts[idx]));
  }
});
